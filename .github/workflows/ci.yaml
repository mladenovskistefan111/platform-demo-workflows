name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  lint:
    permissions:
      contents: read
    uses: ./.github/workflows/workflow-lint.yaml

  # The generated workflows are what the generators write, every job has permissions and a timeout, the flat service-ci-<language>
  # workflows match the stand-alone ones (inputs, guards, pins) and their gate waits for every job (tools/check-consistency.py).
  consistency:
    name: Generated files and conventions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install PyYAML
        run: pip install --quiet "pyyaml==6.0.2"

      - name: Check
        run: python3 tools/check-consistency.py

      # a nested job asking for more than its caller grants is a silent startup_failure
      - name: Check nested permissions
        run: python3 tools/check-permissions.py

      # the gate script of every service-ci-<language> file, run against success/skip/failure/cancel scenarios
      - name: Gate scenarios
        run: python3 tools/test-gate.py
