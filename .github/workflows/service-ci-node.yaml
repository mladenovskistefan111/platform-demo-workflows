name: Service CI (Node)

# GENERATED by tools/gen-service-ci.py - do not edit; change the stand-alone workflow or the generator and run the generator.
#
# The pull-request pipeline of a Node app repository, flat: every job is in this file and nothing is called from here, so the Actions graph shows
# exactly what runs, left to right, with short names (`ci / Check: Build`):
#
#   Guard: Changes | Guard: Secrets | Guard: Workflows   (no needs: start at t=0)
#   Check: Lint | Check: Build | Check: Tests | Security: SCA | Security: SAST | Image: Build + CVE scan
#            (need only `Guard: Changes`; a docs-only change skips them, the guards still run)
#   gate     (needs every job, always runs, names the job that failed first)
#
# The left column means "starts at t=0", not "must pass first": a failed guard does not hide the results of the checks.
# `ci / gate` is the ONLY required check.
# The optional smoke test (input smoke-port) is a step of Check: Build: no extra job, and it reuses the build.
#
# Call it with:  uses: platform-boutique/platform-demo-workflows/.github/workflows/service-ci-node.yaml@<sha> # <tag>
# The calling job must grant: contents: read, packages: read.

on:
  workflow_call:
    inputs:
      image:
        description: Build the image and scan it (when code changed). false for a repository without an image pipeline.
        type: boolean
        default: true
      context:
        description: Docker build context
        type: string
        default: .
      dockerfile:
        description: Dockerfile name inside the context
        type: string
        default: Dockerfile
      trivyignores:
        description: Path to a .trivyignore file in the caller repo (optional)
        type: string
        default: ""
      node-version-file:
        type: string
        default: .nvmrc
      semgrep-config:
        type: string
        default: p/typescript p/nodejs p/secrets
      smoke-port:
        description: gRPC port for a start-the-server health smoke test; empty skips the smoke test
        type: string
        default: ""
      smoke-command:
        description: Command that starts the built server (run after the build)
        type: string
        default: node dist/server.js
      smoke-health-args:
        description: Extra grpcurl arguments for the health check (no reflection, so point at the proto)
        type: string
        default: -import-path ./proto -proto health.proto
      smoke-script:
        description: Optional script in the caller repo for service-specific checks (gets GRPCURL and SMOKE_PORT)
        type: string
        default: ""

# Least privilege by default; every job below declares what it needs.
permissions: {}

jobs:
  changes:
    name: "Guard: Changes"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # a pull request's merge commit and both its parents; a push's commit and its parent
          persist-credentials: false

      - name: Compare with the base
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          is_docs() {
            case "$1" in
              *.md|docs/*|mkdocs.yml|catalog-info.yaml|.github/dependabot.yml|CODEOWNERS|.github/CODEOWNERS|LICENSE|LICENSE.*|.github/ISSUE_TEMPLATE/*) return 0 ;;
            esac
            return 1
          }

          decide() { # decide <true|false> <reason>
            echo "code=$1" >> "$GITHUB_OUTPUT"
            echo "### Change detection: code = $1" >> "$GITHUB_STEP_SUMMARY"
            echo "$2" >> "$GITHUB_STEP_SUMMARY"
            echo "code=$1 ($2)"
            exit 0
          }

          case "$EVENT_NAME" in
            pull_request)
              parents=$(git rev-list --parents -n 1 HEAD | wc -w)
              [ "$parents" -eq 3 ] || decide true "HEAD is not a merge commit; assuming code"
              base=HEAD^1
              ;;
            push)
              base=""
              if [ -n "$BEFORE_SHA" ] && [ "${BEFORE_SHA//0/}" != "" ]; then
                git cat-file -e "${BEFORE_SHA}^{commit}" 2> /dev/null || git fetch --no-tags --depth=1 origin "$BEFORE_SHA" || true
                git cat-file -e "${BEFORE_SHA}^{commit}" 2> /dev/null && base="$BEFORE_SHA"
              fi
              [ -n "$base" ] || { git rev-parse --verify --quiet HEAD^1 > /dev/null && base=HEAD^1; }
              [ -n "$base" ] || decide true "no earlier commit to compare with"
              ;;
            *)
              decide true "manual or scheduled run: everything runs"
              ;;
          esac

          total=0
          while IFS= read -r -d '' file; do
            total=$((total + 1))
            if ! is_docs "$file"; then
              decide true "first code file: $file"
            fi
          done < <(git diff -z --name-only --no-renames "$base" HEAD)

          [ "$total" -gt 0 ] || decide true "empty change"
          decide false "$total file(s) changed, all documentation or metadata"

  secret-scan:
    name: "Guard: Secrets"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # pull request: depth 2 is enough to reach both parents of the merge commit; anything else (manual run): full history
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}
          persist-credentials: false

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSL --retry 3 --retry-all-errors -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Run gitleaks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # the open-source CLI, not gitleaks-action: the Action needs a paid license in organisation-owned repositories
          if [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ]; then
            # Pull request: scan only its commits (BASE..HEAD) without cloning the whole history. Make sure both ends exist, then
            # deepen until they share an ancestor (the range is then complete); give up and fetch everything after 10 rounds.
            for sha in "$BASE_SHA" "$HEAD_SHA"; do
              git cat-file -e "${sha}^{commit}" 2>/dev/null || git fetch --no-tags --depth=2 origin "$sha"
            done
            rounds=0
            until git merge-base "$BASE_SHA" "$HEAD_SHA" > /dev/null 2>&1; do
              rounds=$((rounds + 1))
              if [ "$rounds" -gt 10 ]; then
                git fetch --no-tags --unshallow origin || true
                break
              fi
              git fetch --no-tags --deepen=50 origin "$BASE_SHA" "$HEAD_SHA"
            done
            gitleaks git --redact --verbose --log-opts="${BASE_SHA}..${HEAD_SHA}"   # the pull request's commits
          else
            gitleaks git --redact --verbose                                           # manual run: the whole history
          fi

  workflow-lint:
    name: "Guard: Workflows"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Every action and reusable workflow is pinned to a commit SHA
        run: |
          shopt -s nullglob
          files=(.github/workflows/*.y*ml .github/actions/*/action.y*ml)
          [ ${#files[@]} -gt 0 ] || exit 0
          unpinned=$(grep -nE '^[[:space:]-]*uses:[[:space:]]*[^./[:space:]]' "${files[@]}" | grep -vE '@[0-9a-f]{40}([[:space:]]|$)' || true)
          if [ -n "$unpinned" ]; then
            echo "::error::These references are not pinned to a full commit SHA:"
            echo "$unpinned"
            exit 1
          fi

      - name: actionlint
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -fsSL --retry 3 --retry-all-errors -o actionlint.tgz "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "${SHA256}  actionlint.tgz" | sha256sum -c -
          tar xzf actionlint.tgz actionlint
          ./actionlint -color

  lint:
    name: "Check: Lint"
    needs: [changes]
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ inputs.node-version-file }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

  build:
    name: "Check: Build"
    needs: [changes]
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ inputs.node-version-file }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install grpcurl
        if: inputs.smoke-port != ''
        env:
          VERSION: 1.9.4
          SHA256: 97e13d58d2733a0e62cd2571d1d5f0c02823f0d25282f08bddedf1ad9c5d1736
        run: |
          curl -fsSL -o grpcurl.tgz "https://github.com/fullstorydev/grpcurl/releases/download/v${VERSION}/grpcurl_${VERSION}_linux_x86_64.tar.gz"
          echo "${SHA256}  grpcurl.tgz" | sha256sum -c -
          tar -xzf grpcurl.tgz -C "$RUNNER_TEMP" grpcurl

      - name: Start server and check gRPC health
        if: inputs.smoke-port != ''
        env:
          SMOKE_PORT: ${{ inputs.smoke-port }}
          SMOKE_COMMAND: ${{ inputs.smoke-command }}
          HEALTH_ARGS: ${{ inputs.smoke-health-args }}
          SMOKE_SCRIPT: ${{ inputs.smoke-script }}
        run: |
          export GRPCURL="$RUNNER_TEMP/grpcurl"
          read -ra server_cmd <<< "$SMOKE_COMMAND"
          read -ra health_args <<< "$HEALTH_ARGS"
          PORT="$SMOKE_PORT" "${server_cmd[@]}" &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          sleep 2
          response=$("$GRPCURL" -plaintext "${health_args[@]}" "localhost:${SMOKE_PORT}" grpc.health.v1.Health/Check)
          status=$(echo "$response" | grep -o '"status": "[^"]*"' | cut -d'"' -f4)
          if [ "$status" != "SERVING" ]; then
            echo "FAIL: expected SERVING, got '$status'"
            exit 1
          fi
          echo "PASS: service is SERVING"
          if [ -n "$SMOKE_SCRIPT" ]; then
            bash "$SMOKE_SCRIPT"
          fi

  test:
    name: "Check: Tests"
    needs: [changes]
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ inputs.node-version-file }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:ci

  sca:
    name: "Security: SCA"
    needs: [changes]
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ inputs.node-version-file }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        # audit-level=high: fail only on high/critical findings
        run: npm audit --audit-level=high --omit=dev

  sast:
    name: "Security: SAST"
    needs: [changes]
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install Semgrep
        env:
          VERSION: 1.180.0
        run: pip install "semgrep==${VERSION}"

      - name: Run Semgrep
        env:
          SEMGREP_CONFIG: ${{ inputs.semgrep-config }}
        run: |
          read -ra rules <<< "$SEMGREP_CONFIG"
          args=()
          for rule in "${rules[@]}"; do
            args+=(--config "$rule")
          done
          semgrep scan "${args[@]}" --error --metrics=off

  image:
    name: "Image: Build + CVE scan"
    needs: [changes]
    if: ${{ needs.changes.outputs.code == 'true' && inputs.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # pushes ghcr.io/<repo>:tree-<hash> for a run that may (same repository, not Dependabot); a fork's token is read-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Decide whether this run pushes the image
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          ACTOR: ${{ github.actor }}
        run: |
          # A run pushes the image to ghcr.io only when its token may: a pull request from a fork has a read-only token, and so has one that
          # Dependabot opened. Those runs build into the local Docker daemon and scan that (nothing is pushed, nothing is reused).
          push=true
          if [ "$EVENT" = pull_request ]; then
            if [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ] || [ "$ACTOR" = 'dependabot[bot]' ]; then
              push=false
            fi
          fi
          echo "push=$push" >> "$GITHUB_OUTPUT"
          echo "this run pushes the image to ghcr.io: $push"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io (to read the build cache, and to push the image)
        # a run that cannot push only needs the cache, and a cache that cannot be read only makes the build slower: its failed login must not fail the pull request
        continue-on-error: ${{ steps.mode.outputs.push != 'true' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Name the registry build cache
        id: cache
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}/buildcache" >> "$GITHUB_OUTPUT"

      - name: Find an image built from this tree
        id: find
        env:
          CAN_PUSH: ${{ steps.mode.outputs.push }}
        run: |
          set -euo pipefail
          # The image is named after the content it was built from: the git tree of the checked-out commit. A pull request's merge commit
          # and the squash commit that lands on main have the SAME tree when main did not move, so the image the pull request built is the
          # image that gets published; a different tree (main moved, a rebase with other changes) finds nothing and builds.
          tree=$(git rev-parse 'HEAD^{tree}')
          if ! [[ "$tree" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::unexpected tree id '$tree'"
            exit 1
          fi
          tag_ref="ghcr.io/${GITHUB_REPOSITORY,,}:tree-$tree"
          found=false
          digest=""
          note=""
          if [ "$CAN_PUSH" = true ]; then
            manifest="$RUNNER_TEMP/tree-manifest.json"
            err="$RUNNER_TEMP/tree-lookup.err"
            for attempt in 1 2 3; do
              if docker buildx imagetools inspect --raw "$tag_ref" > "$manifest" 2> "$err" && [ -s "$manifest" ]; then
                found=true
                digest="sha256:$(sha256sum "$manifest" | cut -d' ' -f1)"
                break
              fi
              if grep -qiE 'not found|manifest_unknown|name_unknown|404' "$err"; then
                note="no image for this tree yet"
                break
              fi
              # Not a clean "not found" (network, registry hiccup). Building is always safe: what is built is what gets scanned and shipped.
              note="the lookup failed ($(head -c 200 "$err" | tr '\n' ' ')), so the image is built"
              echo "::warning::looking up $tag_ref failed (attempt $attempt of 3): $(head -c 200 "$err" | tr '\n' ' ')"
              sleep $((attempt * 3))
            done
          else
            note="this run cannot push, so nothing can be reused"
          fi
          {
            echo "tree=$tree"
            echo "tag-ref=$tag_ref"
            echo "found=$found"
            echo "digest=$digest"
          } >> "$GITHUB_OUTPUT"
          if [ "$found" = true ]; then
            echo "tree $tree: image exists ($digest); no build"
          else
            echo "tree $tree: $note"
          fi

      - name: Build the image
        id: build
        if: steps.find.outputs.found != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          push: ${{ steps.mode.outputs.push == 'true' }}
          load: ${{ steps.mode.outputs.push != 'true' }}
          tags: ${{ steps.mode.outputs.push == 'true' && steps.find.outputs.tag-ref || 'service-ci-scan:local' }}
          # where it was built (the signature of the published image names the commit that was shipped)
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha || github.sha }}
            io.platform-demo.tree=${{ steps.find.outputs.tree }}
            io.platform-demo.build-run=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # a run that pushes the image (same repository, not Dependabot) also refreshes the cache; a fork's or Dependabot's run only reads it
          cache-from: type=registry,ref=${{ steps.cache.outputs.ref }}
          cache-to: ${{ steps.mode.outputs.push == 'true' && format('type=registry,ref={0},mode=max,image-manifest=true,oci-mediatypes=true', steps.cache.outputs.ref) || '' }}

      - name: Record the image to scan
        id: image
        env:
          TREE: ${{ steps.find.outputs.tree }}
          FOUND: ${{ steps.find.outputs.found }}
          FOUND_DIGEST: ${{ steps.find.outputs.digest }}
          PUSH: ${{ steps.mode.outputs.push }}
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [ "$FOUND" = true ]; then
            how=reused
            digest=$FOUND_DIGEST
          elif [ "$PUSH" = true ]; then
            how=built
            digest=$BUILT_DIGEST
          else
            how=local
            digest=""
          fi
          if [ "$how" = local ]; then
            ref=service-ci-scan:local
          else
            if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::no valid image digest (got '$digest')"
              exit 1
            fi
            ref="ghcr.io/${GITHUB_REPOSITORY,,}@$digest"
          fi
          {
            echo "ref=$ref"
            echo "digest=$digest"
            echo "how=$how"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Image"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| source tree | \`$TREE\` |"
            case "$how" in
              reused) echo "| image | **reused**: a build of this tree already exists, nothing was built |" ;;
              built) echo "| image | **built** and pushed as \`tree-${TREE:0:12}...\` |" ;;
              *) echo "| image | built locally, not pushed (this run cannot push) |" ;;
            esac
            [ -z "$digest" ] || echo "| digest | \`$digest\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # same version, threshold and ignore file as the scan in service-publish.yaml (which scans the same digest again)
          version: v0.76.1
          image-ref: ${{ steps.image.outputs.ref }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1
          trivyignores: ${{ inputs.trivyignores }}

  gate:
    name: "gate"
    needs: [changes, secret-scan, workflow-lint, lint, build, test, sca, sast, image]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every job passed, or was skipped for a reason we know
        env:
          NEEDS: ${{ toJSON(needs) }}
          IMAGE: ${{ inputs.image }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          # Jobs this workflow has: the three guards and the checks (generated per language). NEEDS holds the result of every one of them.
          guards=" changes secret-scan workflow-lint "
          checks=" lint build test sca sast image "

          case "$IMAGE" in
            true | false) ;;
            *) echo "::error::input image is '$IMAGE', expected true or false"; exit 1 ;;
          esac

          mapfile -t rows < <(jq -r 'to_entries[] | [.key, .value.result] | @tsv' <<< "$NEEDS")
          for job in $guards $checks; do
            jq -e --arg job "$job" 'has($job)' <<< "$NEEDS" > /dev/null || { echo "::error::job $job is missing from needs"; exit 1; }
          done

          # 1. The cause first: a job that failed or was cancelled. Everything downstream of a failed guard is skipped by GitHub, and
          #    that skip is a consequence, not a finding, so it is not reported as one.
          failed=0
          unexplained=0
          {
            echo "### Gate (code changed: ${CODE:-unknown}, image: $IMAGE)"
          } >> "$GITHUB_STEP_SUMMARY"
          for row in "${rows[@]}"; do
            IFS=$'\t' read -r job result <<< "$row"
            case "$result" in
              failure | cancelled)
                failed=1
                echo "::error::$job $result"
                echo "- **$job $result**" >> "$GITHUB_STEP_SUMMARY"
                ;;
            esac
          done

          # 2. What each job should have done. Guards always succeed. Checks succeed when code changed (the image check only if image is on);
          #    otherwise they are skipped: docs-only change, or image off. Any other result is unexplained.
          declare -A want
          for job in $guards; do want[$job]=success; done
          for job in $checks; do
            if [ "$CODE" = "true" ] && { [ "$job" != "image" ] || [ "$IMAGE" = "true" ]; }; then want[$job]=success; else want[$job]=skipped; fi
          done
          if [ "$failed" = 0 ] && [ "$CODE" != "true" ] && [ "$CODE" != "false" ]; then
            echo "::error::change detection gave '$CODE', expected true or false"
            failed=1
          fi

          {
            echo
            echo "| job | result | expected |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for row in "${rows[@]}"; do
            IFS=$'\t' read -r job result <<< "$row"
            expected=${want[$job]:-}
            if [ -z "$expected" ]; then expected="(unknown job)"; fi
            printf '%-14s %-10s (expected %s)\n' "$job" "$result" "$expected"
            echo "| $job | $result | $expected |" >> "$GITHUB_STEP_SUMMARY"
            # Only when nothing failed: otherwise the failure above is the cause and skipped jobs downstream of it are expected.
            if [ "$failed" = 0 ] && [ "$result" != "$expected" ]; then
              echo "::error::$job is '$result', expected '$expected'"
              unexplained=1
            fi
          done
          exit $((failed + unexplained))
