name: Go CI

# Reusable pipeline for the Go services (checkout, shipping, product-catalog, frontend):
# lint/format, secret scan, build, unit tests, then SCA + SAST.
# Call it with:  uses: mladenovskistefan111/platform-demo-workflows/.github/workflows/go-ci.yaml@<tag or sha>

on:
  workflow_call:
    inputs:
      build-path:
        description: Package pattern passed to `go build`
        type: string
        default: ./cmd/server/...
      test-packages:
        description: Package pattern passed to `go test`
        type: string
        default: ./...
      golangci-lint-version:
        type: string
        default: v2.11.4
      govulncheck-version:
        type: string
        default: v1.9.0
      gosec-version:
        type: string
        default: v2.29.0
      e2e-packages:
        description: "Package pattern for `go test -tags e2e` (in-process E2E tests); empty skips the job"
        type: string
        default: ""
      smoke-port:
        description: gRPC port for a start-the-binary health smoke test; empty skips the job
        type: string
        default: ""
      smoke-env:
        description: Newline-separated KEY=value pairs exported before the smoke-test server starts
        type: string
        default: ""

# Least privilege by default; every job below declares what it needs.
permissions: {}

jobs:
  # ─── STAGE 1 (parallel) ───────────────────────────────────────────────────

  lint-format:
    name: Lint & Format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l -e .)
          if [ -n "$unformatted" ]; then
            echo "These files are not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ inputs.golangci-lint-version }}

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # gitleaks lists the PR's commits through the API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so gitleaks scans every commit
          persist-credentials: false

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          BUILD_PATH: ${{ inputs.build-path }}
        run: go build $BUILD_PATH

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run unit tests
        env:
          TEST_PACKAGES: ${{ inputs.test-packages }}
        run: go test $TEST_PACKAGES -v -race -count=1

  # ─── STAGE 2 (parallel) ───────────────────────────────────────────────────

  sca:
    name: SCA - Dependency Vulnerabilities
    runs-on: ubuntu-latest
    needs: [lint-format, secret-scan, build-check, unit-tests]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        env:
          VERSION: ${{ inputs.govulncheck-version }}
        run: go install "golang.org/x/vuln/cmd/govulncheck@${VERSION}"

      - name: Run govulncheck
        run: govulncheck ./...

  sast:
    name: SAST - Static Security Analysis
    runs-on: ubuntu-latest
    needs: [lint-format, secret-scan, build-check, unit-tests]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install gosec
        env:
          VERSION: ${{ inputs.gosec-version }}
        run: go install "github.com/securego/gosec/v2/cmd/gosec@${VERSION}"

      - name: Run gosec
        run: gosec -exclude-generated ./...

  # ─── STAGE 2 (optional, enabled by inputs) ────────────────────────────────

  e2e-tests:
    name: E2E Tests
    if: inputs.e2e-packages != ''
    runs-on: ubuntu-latest
    needs: [lint-format, secret-scan, build-check, unit-tests]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run E2E tests (self-contained, in-process mocks)
        env:
          E2E_PACKAGES: ${{ inputs.e2e-packages }}
        run: go test -tags e2e $E2E_PACKAGES -v -timeout 60s

  smoke-test:
    name: Smoke Test (gRPC health)
    if: inputs.smoke-port != ''
    runs-on: ubuntu-latest
    needs: [lint-format, secret-scan, build-check, unit-tests]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build server binary
        env:
          BUILD_PATH: ${{ inputs.build-path }}
        run: go build -o "$RUNNER_TEMP/server" $BUILD_PATH

      - name: Install grpcurl
        env:
          VERSION: 1.9.1
          SHA256: 588c9c429476d9ed66cd3b2ae32283a6da36e0cfbb7e446f5d6a1b68dc770214
        run: |
          curl -fsSL -o grpcurl.tgz "https://github.com/fullstorydev/grpcurl/releases/download/v${VERSION}/grpcurl_${VERSION}_linux_x86_64.tar.gz"
          echo "${SHA256}  grpcurl.tgz" | sha256sum -c -
          tar -xzf grpcurl.tgz -C "$RUNNER_TEMP" grpcurl

      - name: Start server and check gRPC health
        env:
          SMOKE_PORT: ${{ inputs.smoke-port }}
          SMOKE_ENV: ${{ inputs.smoke-env }}
        run: |
          while IFS= read -r line; do
            [ -n "$line" ] && export "$line"
          done <<< "$SMOKE_ENV"
          PORT="$SMOKE_PORT" "$RUNNER_TEMP/server" &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          sleep 2
          response=$("$RUNNER_TEMP/grpcurl" -plaintext "localhost:${SMOKE_PORT}" grpc.health.v1.Health/Check)
          status=$(echo "$response" | grep -o '"status": "[^"]*"' | cut -d'"' -f4)
          if [ "$status" != "SERVING" ]; then
            echo "FAIL: expected SERVING, got '$status'"
            exit 1
          fi
          echo "PASS: service is SERVING"
