name: Python CI

# Reusable pipeline for the Python services (email, recommendation): ruff, secret scan, import check, pytest, SCA (pip-audit), SAST (bandit).
# Call it with:  uses: platform-boutique/platform-demo-workflows/.github/workflows/python-ci.yaml@<sha> # <tag>

on:
  workflow_call:
    inputs:
      python-version-file:
        type: string
        default: .python-version
      source-dir:
        description: Directory scanned by bandit
        type: string
        default: src/
      build-check-file:
        description: Entry-point file that must parse
        type: string
        default: src/server.py
      tests-path:
        type: string
        default: tests/
      bandit-config:
        type: string
        default: pyproject.toml
      ruff-version:
        type: string
        default: 0.17.0
      pip-audit-version:
        type: string
        default: 2.10.1
      bandit-version:
        type: string
        default: 1.9.4
      secret-scan:
        description: Run the Secret Scan job in this workflow. service-ci sets it to false because it runs one scan for every language itself.
        type: boolean
        default: true

# Least privilege by default; every job below declares what it needs.
permissions: {}

jobs:
  lint-format:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ${{ inputs.python-version-file }}
          cache: pip

      - name: Install lint tools
        env:
          VERSION: ${{ inputs.ruff-version }}
        run: pip install "ruff==${VERSION}"

      - name: Check formatting (ruff format)
        run: ruff format --check .

      - name: Run linter (ruff check)
        run: ruff check .

  secret-scan:
    name: Secret Scan
    if: inputs.secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # pull request: depth 2 is enough to reach both parents of the merge commit; anything else (manual run): full history
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}
          persist-credentials: false

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSL --retry 3 --retry-all-errors -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Run gitleaks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # the open-source CLI, not gitleaks-action: the Action needs a paid license in organisation-owned repositories
          if [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ]; then
            # Pull request: scan only its commits (BASE..HEAD) without cloning the whole history. Make sure both ends exist, then
            # deepen until they share an ancestor (the range is then complete); give up and fetch everything after 10 rounds.
            for sha in "$BASE_SHA" "$HEAD_SHA"; do
              git cat-file -e "${sha}^{commit}" 2>/dev/null || git fetch --no-tags --depth=2 origin "$sha"
            done
            rounds=0
            until git merge-base "$BASE_SHA" "$HEAD_SHA" > /dev/null 2>&1; do
              rounds=$((rounds + 1))
              if [ "$rounds" -gt 10 ]; then
                git fetch --no-tags --unshallow origin || true
                break
              fi
              git fetch --no-tags --deepen=50 origin "$BASE_SHA" "$HEAD_SHA"
            done
            gitleaks git --redact --verbose --log-opts="${BASE_SHA}..${HEAD_SHA}"   # the pull request's commits
          else
            gitleaks git --redact --verbose                                           # manual run: the whole history
          fi

  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ${{ inputs.python-version-file }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify entry point parses (build smoke)
        env:
          BUILD_FILE: ${{ inputs.build-check-file }}
        run: python -c "import ast, os; ast.parse(open(os.environ['BUILD_FILE']).read()); print('Parse OK')"

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ${{ inputs.python-version-file }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run unit tests
        env:
          TESTS_PATH: ${{ inputs.tests-path }}
        run: pytest "$TESTS_PATH" -v --tb=short

  # ─── security scans (all jobs run in parallel) ────────────────────────────

  sca:
    name: SCA - Dependency Vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ${{ inputs.python-version-file }}
          cache: pip

      - name: Install pip-audit
        env:
          VERSION: ${{ inputs.pip-audit-version }}
        run: pip install "pip-audit==${VERSION}"

      - name: Run pip-audit
        run: pip-audit -r requirements.txt

  sast:
    name: SAST - Static Security Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ${{ inputs.python-version-file }}
          cache: pip

      - name: Install bandit
        env:
          VERSION: ${{ inputs.bandit-version }}
        run: pip install "bandit==${VERSION}"

      - name: Run bandit
        env:
          SOURCE_DIR: ${{ inputs.source-dir }}
          BANDIT_CONFIG: ${{ inputs.bandit-config }}
        run: bandit -r "$SOURCE_DIR" -c "$BANDIT_CONFIG"
