name: Docker build and scan

# Language-agnostic image gate shared by all services:
#   1. build - build once, push to ghcr.io (staging) and record the digest
#   2. scan  - Trivy (HIGH/CRITICAL fail) on that exact digest
# Nothing is published to Docker Hub here; see docker-promote.yaml for that.
# Call it with:  uses: platform-boutique/platform-demo-workflows/.github/workflows/docker-build.yaml@<tag or sha>

on:
  workflow_call:
    inputs:
      context:
        type: string
        default: .
      dockerfile:
        type: string
        default: Dockerfile
      trivyignores:
        description: Path to a .trivyignore file in the caller repo (optional)
        type: string
        default: ""
    outputs:
      staged-image:
        description: ghcr.io reference (by digest) that was scanned
        value: ${{ jobs.build.outputs.staged-image }}
      digest:
        description: Image digest that was scanned
        value: ${{ jobs.build.outputs.digest }}

# Least privilege by default; every job below declares what it needs.
permissions: {}

jobs:
  build:
    name: Build & Stage Image (ghcr.io)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      staged-image: ${{ steps.image-ref.outputs.ref }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push to ghcr.io (staging)
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record the staged image reference (by digest)
        id: image-ref
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY}@${DIGEST}" >> "$GITHUB_OUTPUT"

  scan-image:
    name: Scan Image for CVEs
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.trivyignores != ''
        with:
          persist-credentials: false

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ needs.build.outputs.staged-image }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1
          trivyignores: ${{ inputs.trivyignores }}
