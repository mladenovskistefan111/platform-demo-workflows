name: Service CI (no language pipeline)

# GENERATED by tools/gen-service-ci.py - do not edit; change the stand-alone workflow or the generator and run the generator.
#
# The pull-request pipeline of a repository without a language pipeline, flat: every job is in this file and nothing is called from here, so the Actions graph shows
# exactly what runs, left to right, with plain names (`ci / Build`):
#
#   Detect changes | Secret scan | Workflow lint   (no needs: start at t=0)
#   Image build and scan
#            (need only `Detect changes`; a docs-only change skips them, the guards still run)
#   gate     (needs every job, always runs, names the job that failed first)
#
# The left column means "starts at t=0", not "must pass first": a failed guard does not hide the results of the checks.
# `ci / gate` is the ONLY required check.
# `image: false` (product-catalog-db) leaves only the guards and the gate; the image job is then skipped. With the image
# left on this suits a repository whose tests are their own jobs (the developer portal).
#
# Call it with:  uses: platform-boutique/platform-demo-workflows/.github/workflows/service-ci-none.yaml@<sha> # <tag>
# The calling job must grant: contents: read and packages: write (the image job pushes the tree image).

on:
  workflow_call:
    inputs:
      image:
        description: Build the image and scan it (when code changed). false for a repository without an image pipeline.
        type: boolean
        default: true
      context:
        description: Docker build context
        type: string
        default: .
      dockerfile:
        description: Dockerfile name inside the context
        type: string
        default: Dockerfile
      trivyignores:
        description: Path to a .trivyignore file in the caller repo (optional)
        type: string
        default: ""

# Least privilege by default; every job below declares what it needs.
permissions: {}

jobs:
  changes:
    name: "Detect changes"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # a pull request's merge commit and both its parents; a push's commit and its parent
          persist-credentials: false

      - name: Compare with the base
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          is_docs() {
            case "$1" in
              *.md|docs/*|mkdocs.yml|catalog-info.yaml|.github/dependabot.yml|CODEOWNERS|.github/CODEOWNERS|LICENSE|LICENSE.*|.github/ISSUE_TEMPLATE/*) return 0 ;;
            esac
            return 1
          }

          files=()        # every changed file, once the comparison got that far
          first_code=""   # the first of them that is not documentation or metadata
          workflows=0     # 1 when a workflow file or a local action is part of the change
          skipped="Tests, scans and the image build are skipped."

          # A file name is untrusted text. For the log and the summary: printable ASCII only (anything else becomes ?), no backtick
          # (so it cannot leave its code span), at most 200 characters.
          safe() { printf '%s' "$1" | LC_ALL=C tr -c '\040-\176' '?' | tr '`' "'" | cut -c1-200; }

          write_summary() { # write_summary <true|false> <reason>
            local n=${#files[@]} i
            {
              echo "### What changed"
              echo
              if [ "$1" = false ]; then
                echo "**Documentation only.** $skipped"
              elif [ -n "$first_code" ]; then
                echo "**Code changed.** \`$(safe "$first_code")\` is not documentation or metadata, so everything runs."
              else
                echo "**Treated as a code change.** Reason: $2."
              fi
              if [ "$n" -gt 0 ]; then
                echo
                echo "$n changed file$([ "$n" -eq 1 ] || echo s)."
              fi
              if [ "$EVENT_NAME" = pull_request ] && [ "$workflows" = 1 ]; then
                echo
                echo "**Workflow files are part of this change.** Approving the merge includes them: read them first."
              fi
              if [ "$n" -gt 0 ]; then
                echo
                echo "<details><summary>Changed files ($n)</summary>"
                echo
                for ((i = 0; i < n && i < 50; i++)); do
                  echo "- \`$(safe "${files[$i]}")\`"
                done
                if [ "$n" -gt 50 ]; then echo "- and $((n - 50)) more"; fi
                echo
                echo "</details>"
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          }

          decide() { # decide <true|false> <reason>
            echo "code=$1" >> "$GITHUB_OUTPUT"
            write_summary "$1" "$2"
            echo "code=$1 ($2)"
            exit 0
          }

          case "$EVENT_NAME" in
            pull_request)
              parents=$(git rev-list --parents -n 1 HEAD | wc -w)
              [ "$parents" -eq 3 ] || decide true "HEAD is not a merge commit; assuming code"
              base=HEAD^1
              ;;
            push)
              base=""
              if [ -n "$BEFORE_SHA" ] && [ "${BEFORE_SHA//0/}" != "" ]; then
                git cat-file -e "${BEFORE_SHA}^{commit}" 2> /dev/null || git fetch --no-tags --depth=1 origin "$BEFORE_SHA" || true
                git cat-file -e "${BEFORE_SHA}^{commit}" 2> /dev/null && base="$BEFORE_SHA"
              fi
              [ -n "$base" ] || { git rev-parse --verify --quiet HEAD^1 > /dev/null && base=HEAD^1; }
              [ -n "$base" ] || decide true "no earlier commit to compare with"
              ;;
            *)
              decide true "manual or scheduled run: everything runs"
              ;;
          esac

          while IFS= read -r -d '' file; do
            files+=("$file")
            case "$file" in .github/workflows/* | .github/actions/*) workflows=1 ;; esac
            if [ -z "$first_code" ] && ! is_docs "$file"; then
              first_code=$file
            fi
          done < <(git diff -z --name-only --no-renames "$base" HEAD)

          total=${#files[@]}
          [ "$total" -gt 0 ] || decide true "empty change"
          [ -z "$first_code" ] || decide true "first code file: $(safe "$first_code")"
          decide false "$total file(s) changed, all documentation or metadata"

  secret-scan:
    name: "Secret scan"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # pull request: depth 2 is enough to reach both parents of the merge commit; anything else (manual run): full history
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}
          persist-credentials: false

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSL --retry 3 --retry-all-errors -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Run gitleaks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # the open-source CLI, not gitleaks-action: the Action needs a paid license in organisation-owned repositories
          if [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ]; then
            # Pull request: scan only its commits (BASE..HEAD) without cloning the whole history. Make sure both ends exist, then
            # deepen until they share an ancestor (the range is then complete); give up and fetch everything after 10 rounds.
            for sha in "$BASE_SHA" "$HEAD_SHA"; do
              git cat-file -e "${sha}^{commit}" 2>/dev/null || git fetch --no-tags --depth=2 origin "$sha"
            done
            rounds=0
            until git merge-base "$BASE_SHA" "$HEAD_SHA" > /dev/null 2>&1; do
              rounds=$((rounds + 1))
              if [ "$rounds" -gt 10 ]; then
                git fetch --no-tags --unshallow origin || true
                break
              fi
              git fetch --no-tags --deepen=50 origin "$BASE_SHA" "$HEAD_SHA"
            done
            gitleaks git --redact --verbose --log-opts="${BASE_SHA}..${HEAD_SHA}"   # the pull request's commits
          else
            gitleaks git --redact --verbose                                           # manual run: the whole history
          fi

  workflow-lint:
    name: "Workflow lint"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Every action and reusable workflow is pinned to a commit SHA
        run: |
          shopt -s nullglob
          files=(.github/workflows/*.y*ml .github/actions/*/action.y*ml)
          [ ${#files[@]} -gt 0 ] || exit 0
          unpinned=$(grep -nE '^[[:space:]-]*uses:[[:space:]]*[^./[:space:]]' "${files[@]}" | grep -vE '@[0-9a-f]{40}([[:space:]]|$)' || true)
          if [ -n "$unpinned" ]; then
            echo "::error::These references are not pinned to a full commit SHA:"
            echo "$unpinned"
            exit 1
          fi

      - name: actionlint
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -fsSL --retry 3 --retry-all-errors -o actionlint.tgz "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "${SHA256}  actionlint.tgz" | sha256sum -c -
          tar xzf actionlint.tgz actionlint
          ./actionlint -color

  image:
    name: "Image build and scan"
    needs: [changes]
    if: ${{ needs.changes.outputs.code == 'true' && inputs.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # pushes ghcr.io/<repo>:tree-<hash> for a run that may (same repository, not Dependabot); a fork's token is read-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Decide whether this run pushes the image
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          ACTOR: ${{ github.actor }}
        run: |
          # A run pushes the image to ghcr.io only when its token may: a pull request from a fork has a read-only token, and so has one that
          # Dependabot opened. Those runs build into the local Docker daemon and scan that (nothing is pushed, nothing is reused).
          push=true
          if [ "$EVENT" = pull_request ]; then
            if [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ] || [ "$ACTOR" = 'dependabot[bot]' ]; then
              push=false
            fi
          fi
          echo "push=$push" >> "$GITHUB_OUTPUT"
          echo "this run pushes the image to ghcr.io: $push"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io (to read the build cache, and to push the image)
        # a run that cannot push only needs the cache, and a cache that cannot be read only makes the build slower: its failed login must not fail the pull request
        continue-on-error: ${{ steps.mode.outputs.push != 'true' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Name the registry build cache
        id: cache
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}/buildcache" >> "$GITHUB_OUTPUT"

      - name: Find an image built from this tree
        id: find
        env:
          CAN_PUSH: ${{ steps.mode.outputs.push }}
        run: |
          set -euo pipefail
          # The image is named after the content it was built from: the git tree of the checked-out commit. A pull request's merge commit
          # and the squash commit that lands on main have the SAME tree when main did not move, so the image the pull request built is the
          # image that gets published; a different tree (main moved, a rebase with other changes) finds nothing and builds.
          tree=$(git rev-parse 'HEAD^{tree}')
          if ! [[ "$tree" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::unexpected tree id '$tree'"
            exit 1
          fi
          tag_ref="ghcr.io/${GITHUB_REPOSITORY,,}:tree-$tree"
          found=false
          digest=""
          note=""
          if [ "$CAN_PUSH" = true ]; then
            manifest="$RUNNER_TEMP/tree-manifest.json"
            err="$RUNNER_TEMP/tree-lookup.err"
            for attempt in 1 2 3; do
              if docker buildx imagetools inspect --raw "$tag_ref" > "$manifest" 2> "$err" && [ -s "$manifest" ]; then
                found=true
                digest="sha256:$(sha256sum "$manifest" | cut -d' ' -f1)"
                break
              fi
              if grep -qiE 'not found|manifest_unknown|name_unknown|404' "$err"; then
                note="no image for this tree yet"
                break
              fi
              # Not a clean "not found" (network, registry hiccup). Building is always safe: what is built is what gets scanned and shipped.
              note="the lookup failed ($(head -c 200 "$err" | tr '\n' ' ')), so the image is built"
              echo "::warning::looking up $tag_ref failed (attempt $attempt of 3): $(head -c 200 "$err" | tr '\n' ' ')"
              sleep $((attempt * 3))
            done
          else
            note="this run cannot push, so nothing can be reused"
          fi
          {
            echo "tree=$tree"
            echo "tag-ref=$tag_ref"
            echo "found=$found"
            echo "digest=$digest"
          } >> "$GITHUB_OUTPUT"
          if [ "$found" = true ]; then
            echo "tree $tree: image exists ($digest); no build"
          else
            echo "tree $tree: $note"
          fi

      - name: Build the image
        id: build
        if: steps.find.outputs.found != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          push: ${{ steps.mode.outputs.push == 'true' }}
          load: ${{ steps.mode.outputs.push != 'true' }}
          tags: ${{ steps.mode.outputs.push == 'true' && steps.find.outputs.tag-ref || 'service-ci-scan:local' }}
          # where it was built (the signature of the published image names the commit that was shipped)
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha || github.sha }}
            io.platform-demo.tree=${{ steps.find.outputs.tree }}
            io.platform-demo.build-run=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # a run that pushes the image (same repository, not Dependabot) also refreshes the cache; a fork's or Dependabot's run only reads it
          cache-from: type=registry,ref=${{ steps.cache.outputs.ref }}
          cache-to: ${{ steps.mode.outputs.push == 'true' && format('type=registry,ref={0},mode=max,image-manifest=true,oci-mediatypes=true', steps.cache.outputs.ref) || '' }}

      - name: Record the image to scan
        id: image
        env:
          TREE: ${{ steps.find.outputs.tree }}
          FOUND: ${{ steps.find.outputs.found }}
          FOUND_DIGEST: ${{ steps.find.outputs.digest }}
          PUSH: ${{ steps.mode.outputs.push }}
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [ "$FOUND" = true ]; then
            how=reused
            digest=$FOUND_DIGEST
          elif [ "$PUSH" = true ]; then
            how=built
            digest=$BUILT_DIGEST
          else
            how=local
            digest=""
          fi
          if [ "$how" = local ]; then
            ref=service-ci-scan:local
          else
            if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::no valid image digest (got '$digest')"
              exit 1
            fi
            ref="ghcr.io/${GITHUB_REPOSITORY,,}@$digest"
          fi
          {
            echo "ref=$ref"
            echo "digest=$digest"
            echo "how=$how"
          } >> "$GITHUB_OUTPUT"

      - name: Run Trivy vulnerability scanner
        id: trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # same version, threshold and ignore file as the scan in service-publish.yaml (which scans the same digest again)
          version: v0.76.1
          image-ref: ${{ steps.image.outputs.ref }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1
          trivyignores: ${{ inputs.trivyignores }}

      - name: Write the image summary
        if: ${{ !cancelled() }}
        env:
          TREE: ${{ steps.find.outputs.tree }}
          HOW: ${{ steps.image.outputs.how }}
          DIGEST: ${{ steps.image.outputs.digest }}
          SCAN: ${{ steps.trivy.outcome }}
        run: |
          set -euo pipefail
          {
            echo "### Image"
            echo
            case "$HOW" in
              reused) echo "**Reused.** An image of this source tree already exists, so nothing was built." ;;
              built) echo "**Built** and pushed to the staging registry (ghcr.io)." ;;
              local) echo "**Built locally, not pushed.** This run cannot push (a fork or Dependabot pull request), so nothing is reused or published from it." ;;
              *) echo "**No image was produced.** See the failed step in the log." ;;
            esac
            echo
            echo "| | |"
            echo "|---|---|"
            if [ -n "$TREE" ] && { [ "$HOW" = reused ] || [ "$HOW" = built ]; }; then
              echo "| Tag | \`tree-$TREE\` |"
            fi
            [ -z "$DIGEST" ] || echo "| Digest | \`$DIGEST\` |"
            if [ -n "${SCAN:-}" ]; then
              case "$SCAN" in
                success) echo "| Trivy scan | passed: no HIGH or CRITICAL vulnerabilities |" ;;
                failure) echo "| Trivy scan | **failed**: HIGH or CRITICAL vulnerabilities, or the scan could not run. The table is in the log of the step \"Run Trivy vulnerability scanner\" |" ;;
                *) echo "| Trivy scan | not run |" ;;
              esac
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  gate:
    name: "gate"
    needs: [changes, secret-scan, workflow-lint, image]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every job passed, or was skipped for a reason we know
        env:
          NEEDS: ${{ toJSON(needs) }}
          IMAGE: ${{ inputs.image }}
          CODE: ${{ needs.changes.outputs.code }}
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          ACTOR: ${{ github.actor }}
        run: |
          # Jobs this workflow has, in the order of the graph: the three guards, then the checks (generated per language), and their names.
          guards=" changes secret-scan workflow-lint "
          checks=" image "
          declare -A names=([changes]="Detect changes" [secret-scan]="Secret scan" [workflow-lint]="Workflow lint" [image]="Image build and scan")

          # Text that does not come from this script (an unknown job id, a result) is shown with letters, digits and . _ - only.
          safe() { printf '%s' "$1" | LC_ALL=C tr -c 'A-Za-z0-9._-' '?' | cut -c1-60; }
          label() { echo "${names[$1]:-$(safe "$1")}"; }
          words() {
            case "$1" in
              success) echo passed ;;
              failure) echo failed ;;
              cancelled) echo cancelled ;;
              skipped) echo skipped ;;
              *) safe "$1" ;;
            esac
          }

          stop() { # stop <message for the log> <heading for the summary>: nothing can be judged
            echo "::error::$1"
            echo "### Blocked: $2" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }

          case "$IMAGE" in
            true | false) ;;
            *) stop "input image is '$IMAGE', expected true or false" "the input image is neither true nor false" ;;
          esac

          declare -A result
          unknown=()
          mapfile -t rows < <(jq -r 'to_entries[] | [.key, .value.result] | @tsv' <<< "$NEEDS")
          for row in "${rows[@]}"; do
            IFS=$'\t' read -r job res <<< "$row"
            result[$job]=$res
            [ -n "${names[$job]+x}" ] || unknown+=("$job")
          done
          for job in $guards $checks; do
            [ -n "${result[$job]+x}" ] || stop "job $job is missing from needs" "$(label "$job") is missing from the results the gate received"
          done

          # 1. The cause first: a job that failed or was cancelled. Everything downstream of a failed guard is skipped by GitHub, and
          #    that skip is a consequence, not a finding, so it is not reported as one.
          failed=0
          unexplained=0
          bad_code=0
          causes=()
          for job in $guards $checks "${unknown[@]}"; do
            case "${result[$job]}" in
              failure | cancelled)
                failed=1
                echo "::error::$job ${result[$job]}"
                causes+=("$job")
                ;;
            esac
          done

          # 2. What each job should have done. Guards always succeed. Checks succeed when code changed (the image check only if image is on);
          #    otherwise they are skipped: docs-only change, or image off. Any other result is unexplained.
          declare -A want
          for job in $guards; do want[$job]=success; done
          for job in $checks; do
            if [ "$CODE" = "true" ] && { [ "$job" != "image" ] || [ "$IMAGE" = "true" ]; }; then want[$job]=success; else want[$job]=skipped; fi
          done
          if [ "$failed" = 0 ] && [ "$CODE" != "true" ] && [ "$CODE" != "false" ]; then
            echo "::error::change detection gave '$CODE', expected true or false"
            failed=1
            bad_code=1
          fi

          table=""
          first_unexplained=""
          for job in $guards $checks "${unknown[@]}"; do
            res=${result[$job]}
            expected=${want[$job]:-}
            shown_expected=${expected:-(unknown job)}
            printf '%-14s %-10s (expected %s)\n' "$job" "$res" "$shown_expected"
            if [ -z "$expected" ]; then
              cell="$(words "$res") (unknown job)"
            elif [ "$res" = "$expected" ]; then
              cell=$(words "$res")
              if [ "$res" = skipped ]; then
                if [ "$CODE" = "false" ]; then cell="skipped: documentation only"; else cell="skipped: no image pipeline"; fi
              fi
            elif [ "$failed" = 1 ]; then
              cell=$(words "$res")
            else
              cell="$(words "$res"), expected $(words "$expected")"
            fi
            table+="| $(label "$job") | $cell |"$'\n'
            # Only when nothing failed: otherwise the failure above is the cause and skipped jobs downstream of it are expected.
            if [ "$failed" = 0 ] && [ "$res" != "$expected" ]; then
              echo "::error::$job is '$res', expected '$shown_expected'"
              unexplained=1
              [ -n "$first_unexplained" ] || first_unexplained=$job
            fi
          done

          # 3. The summary: the verdict first, then what changed, the results, and what the Merge button will do.
          blocked=1
          if [ "${#causes[@]}" -gt 0 ]; then
            verdict="Blocked: $(label "${causes[0]}") $(words "${result[${causes[0]}]}")"
            [ "${#causes[@]}" -eq 1 ] || verdict+=" (and $((${#causes[@]} - 1)) more)"
          elif [ "$bad_code" = 1 ]; then
            verdict="Blocked: change detection gave no valid answer"
          elif [ "$unexplained" = 1 ]; then
            verdict="Blocked: $(label "$first_unexplained") ended as $(words "${result[$first_unexplained]}"), which was not expected"
          elif [ "$EVENT" = pull_request ]; then
            verdict="Ready to merge"
            blocked=0
          else
            verdict="All checks passed"
            blocked=0
          fi

          {
            echo "### $verdict"
            echo
            case "$CODE" in
              true) echo "Change: **code**. All checks apply."; echo ;;
              false) echo "Change: **documentation only**. Tests, scans and the image build were skipped."; echo ;;
            esac
            echo "| Job | Result |"
            echo "|---|---|"
            printf '%s' "$table"
            if [ "$EVENT" = pull_request ]; then
              echo
              if [ "$blocked" = 1 ]; then
                echo "Merging is blocked: \`ci / gate\` is the required check. The \`merge\` job does not run after a failed run."
              elif [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ] && [ "$ACTOR" != 'dependabot[bot]' ]; then
                publish=""
                [ "$IMAGE" != true ] || publish=" and start Publish"
                echo "**Merge button:** approve the \`merge\` environment on this run page (Review deployments) to squash-merge this pull request${publish}."
                if [ "$IMAGE" = true ] && [ "$CODE" = false ]; then
                  echo "Publish will find only documentation and publish nothing."
                fi
              else
                echo "The \`merge\` job does not run for fork or Dependabot pull requests: use the Merge button on the pull request."
                if [ "$IMAGE" = true ]; then echo "Publish starts from the push to \`main\`."; fi
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit $((failed + unexplained))
