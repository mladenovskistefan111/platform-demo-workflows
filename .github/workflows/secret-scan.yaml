name: Secret scan

# Stand-alone gitleaks scan for repos that have no language pipeline (Helm charts, compose files, docs).
# The language workflows (go-ci, node-ci, ...) already contain the same job.
# Call it with:  uses: mladenovskistefan111/platform-demo-workflows/.github/workflows/secret-scan.yaml@<sha> # <tag>

on:
  workflow_call:

permissions: {}

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # gitleaks lists the PR's commits through the API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so gitleaks scans every commit
          persist-credentials: false

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
