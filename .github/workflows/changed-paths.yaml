name: Changed paths

# Tells service-ci and service-publish whether a change touches anything but documentation and metadata, so the expensive jobs
# (tests, scans, image build) can be skipped for a docs-only pull request or merge. Plain git, no third-party action, no API token:
#   pull request  -> the files the PR changes against its base (the checked-out merge commit minus its first parent)
#   push          -> the files between `before` and the pushed commit
#   anything else (manual run, ...) -> code = true
# "Documentation and metadata" is: *.md, docs/**, mkdocs.yml, catalog-info.yaml, .github/dependabot.yml, CODEOWNERS, LICENSE*,
# .github/ISSUE_TEMPLATE/**. Everything else counts as code (workflow files, Dockerfiles, .trivyignore, ... included).
# When in doubt (no parent commit, a fetch fails, an empty change) the answer is code = true.
# Call it with:  uses: platform-boutique/platform-demo-workflows/.github/workflows/changed-paths.yaml@<sha> # <tag>

on:
  workflow_call:
    outputs:
      code:
        description: "'true' unless every changed file is documentation or metadata"
        value: ${{ jobs.detect.outputs.code }}

permissions: {}

jobs:
  detect:
    name: Detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # a pull request's merge commit and both its parents; a push's commit and its parent
          persist-credentials: false

      - name: Compare with the base
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          is_docs() {
            case "$1" in
              *.md|docs/*|mkdocs.yml|catalog-info.yaml|.github/dependabot.yml|CODEOWNERS|.github/CODEOWNERS|LICENSE|LICENSE.*|.github/ISSUE_TEMPLATE/*) return 0 ;;
            esac
            return 1
          }

          files=()        # every changed file, once the comparison got that far
          first_code=""   # the first of them that is not documentation or metadata
          workflows=0     # 1 when a workflow file or a local action is part of the change
          skipped="Tests, scans and the image build are skipped."

          # A file name is untrusted text. For the log and the summary: printable ASCII only (anything else becomes ?), no backtick
          # (so it cannot leave its code span), at most 200 characters.
          safe() { printf '%s' "$1" | LC_ALL=C tr -c '\040-\176' '?' | tr '`' "'" | cut -c1-200; }

          write_summary() { # write_summary <true|false> <reason>
            local n=${#files[@]} i
            {
              echo "### What changed"
              echo
              if [ "$1" = false ]; then
                echo "**Documentation only.** $skipped"
              elif [ -n "$first_code" ]; then
                echo "**Code changed.** \`$(safe "$first_code")\` is not documentation or metadata, so everything runs."
              else
                echo "**Treated as a code change.** Reason: $2."
              fi
              if [ "$n" -gt 0 ]; then
                echo
                echo "$n changed file$([ "$n" -eq 1 ] || echo s)."
              fi
              if [ "$EVENT_NAME" = pull_request ] && [ "$workflows" = 1 ]; then
                echo
                echo "**Workflow files are part of this change.** Approving the merge includes them: read them first."
              fi
              if [ "$n" -gt 0 ]; then
                echo
                echo "<details><summary>Changed files ($n)</summary>"
                echo
                for ((i = 0; i < n && i < 50; i++)); do
                  echo "- \`$(safe "${files[$i]}")\`"
                done
                if [ "$n" -gt 50 ]; then echo "- and $((n - 50)) more"; fi
                echo
                echo "</details>"
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          }

          decide() { # decide <true|false> <reason>
            echo "code=$1" >> "$GITHUB_OUTPUT"
            write_summary "$1" "$2"
            echo "code=$1 ($2)"
            exit 0
          }

          case "$EVENT_NAME" in
            pull_request)
              parents=$(git rev-list --parents -n 1 HEAD | wc -w)
              [ "$parents" -eq 3 ] || decide true "HEAD is not a merge commit; assuming code"
              base=HEAD^1
              ;;
            push)
              base=""
              if [ -n "$BEFORE_SHA" ] && [ "${BEFORE_SHA//0/}" != "" ]; then
                git cat-file -e "${BEFORE_SHA}^{commit}" 2> /dev/null || git fetch --no-tags --depth=1 origin "$BEFORE_SHA" || true
                git cat-file -e "${BEFORE_SHA}^{commit}" 2> /dev/null && base="$BEFORE_SHA"
              fi
              [ -n "$base" ] || { git rev-parse --verify --quiet HEAD^1 > /dev/null && base=HEAD^1; }
              [ -n "$base" ] || decide true "no earlier commit to compare with"
              ;;
            *)
              decide true "manual or scheduled run: everything runs"
              ;;
          esac

          while IFS= read -r -d '' file; do
            files+=("$file")
            case "$file" in .github/workflows/* | .github/actions/*) workflows=1 ;; esac
            if [ -z "$first_code" ] && ! is_docs "$file"; then
              first_code=$file
            fi
          done < <(git diff -z --name-only --no-renames "$base" HEAD)

          total=${#files[@]}
          [ "$total" -gt 0 ] || decide true "empty change"
          [ -z "$first_code" ] || decide true "first code file: $(safe "$first_code")"
          decide false "$total file(s) changed, all documentation or metadata"
