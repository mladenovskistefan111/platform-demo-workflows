name: Service publish

# GENERATED by tools/gen-service-publish.py - do not edit; change the source workflow or the generator and run the generator.
#
# The merge-to-main pipeline of every app repository, ONE flat workflow (no nested publish boxes in the Actions graph):
#
#   Detect changes -> Find or build image -> Scan image -> Publish image -+-> Create SBOM
#                                                                         +-> Open dev PR
#                                                                         +-> Clean up staging images
#
#   Detect changes        a docs/metadata-only commit publishes nothing (a manual run with `before` diffs before..HEAD like a push)
#   Find or build image   the image of this commit's source tree: ghcr.io/<repo>:tree-<git tree hash>. FOUND (the pull request built
#                         it, main did not move) = reused, no build. NOT FOUND (the tree differs, or the image was pruned) = built now,
#                         the registry build cache is written, pushed under the same tag so a re-run finds it
#   Scan image            Trivy on that exact digest, again (new CVEs may have appeared since the pull request)
#   Publish image         copy that digest to Docker Hub as sha-<7 chars of the commit> ONLY (no latest, no semver; a digest that
#                         differs from the scanned one fails the run), cosign sign (keyless), verify; refuses commits not reachable from main
#   Create SBOM           SBOM attestation, signed, verified; next to the helm pull request, not before it; a failure fails the run
#   Open dev PR           the pull request in the helm repository that moves env `dev` to this digest (gitops-promote.yaml, unchanged)
#   Clean up staging images   best effort (the job may fail without failing the run): keep the newest `prune-keep` (10) `sha-*` and
#                         `prune-keep-tree` (20) `tree-*` versions of the ghcr.io package, never the buildcache package, never an
#                         image-index child of a kept image
#
# Each job writes its own short section of the run summary; `Publish image` carries the answer to "what was published": the Docker Hub
# tag, the commit, the digest, the signature and where the dev change goes. In the caller's run the checks are named `publish / <name>`.
# Release tags and `latest` are not made here: a version is chosen when the digest is promoted to stage/prod in the helm repository.
#
# Concurrency (in the caller, group `publish-<ref>`, no cancel) runs one publish at a time. A run waiting behind a running one is
# REPLACED by a newer waiting one: of three quick merges the second never publishes by itself, the third publishes the tree of main
# which contains it (docs-only third merge after a code merge: see docs/build-once.md).
#
# Call it with:  uses: platform-boutique/platform-demo-workflows/.github/workflows/service-publish.yaml@<sha> # <tag>
# The calling job must grant: contents: read, packages: write, id-token: write.

on:
  workflow_call:
    inputs:
      app:
        description: Helm chart / application name = repository name without the `app-` prefix, e.g. checkout-service
        type: string
        required: true
      image-name:
        description: Docker Hub repository name under the account (default = app)
        type: string
        default: ""
      context:
        type: string
        default: .
      dockerfile:
        type: string
        default: Dockerfile
      trivyignores:
        description: Path to a .trivyignore file in the caller repo (optional)
        type: string
        default: ""
      before:
        description: >-
          Commit the manual run starts from (workflow_dispatch only; a push uses github.event.before): when set, a run whose
          before..HEAD changed only documentation publishes nothing. Empty on a manual run = publish.
        type: string
        default: ""
      env:
        description: Environment of the helm repository the new digest is proposed for
        type: string
        default: dev
      auto-merge:
        description: Let the helm pull request merge itself once the helm repository's checks pass
        type: boolean
        default: true
      version:
        description: Optional version label for gitops-promote (normally empty on dev)
        type: string
        default: ""
      prune:
        description: Prune old ghcr.io images after publishing (best effort)
        type: boolean
        default: true
      prune-keep:
        description: How many of the newest `sha-*` versions of the ghcr.io package the prune keeps
        type: number
        default: 10
      prune-keep-tree:
        description: How many of the newest `tree-*` versions it keeps (every pull-request push makes one, so more than `sha-*`)
        type: number
        default: 20
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true
      PROMOTE_APP_ID:
        required: true
      PROMOTE_APP_PRIVATE_KEY:
        required: true
    outputs:
      published:
        description: "'true' when an image was published, 'false' for a documentation-only commit (or a ref other than main)"
        value: ${{ jobs.publish.outputs.digest != '' }}
      digest:
        description: Image digest (sha256:...)
        value: ${{ jobs.publish.outputs.digest }}
      tag:
        description: The sha-<7 chars> tag
        value: ${{ jobs.publish.outputs.tag }}
      pr-url:
        description: URL of the helm pull request
        value: ${{ jobs.deploy.outputs.pr-url }}

# Least privilege by default; every job below declares what it needs.
permissions: {}

jobs:
  changes:
    name: "Detect changes"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # a pull request's merge commit and both its parents; a push's commit and its parent
          persist-credentials: false

      - name: Compare with the base
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ inputs.before || github.event.before }}
        run: |
          if [ -n "$BEFORE_SHA" ] && ! [[ "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::before must be a full 40-character commit SHA (got '$BEFORE_SHA')"
            exit 1
          fi

          is_docs() {
            case "$1" in
              *.md|docs/*|mkdocs.yml|catalog-info.yaml|.github/dependabot.yml|CODEOWNERS|.github/CODEOWNERS|LICENSE|LICENSE.*|.github/ISSUE_TEMPLATE/*) return 0 ;;
            esac
            return 1
          }

          files=()        # every changed file, once the comparison got that far
          first_code=""   # the first of them that is not documentation or metadata
          workflows=0     # 1 when a workflow file or a local action is part of the change
          skipped="Nothing is published."

          # A file name is untrusted text. For the log and the summary: printable ASCII only (anything else becomes ?), no backtick
          # (so it cannot leave its code span), at most 200 characters.
          safe() { printf '%s' "$1" | LC_ALL=C tr -c '\040-\176' '?' | tr '`' "'" | cut -c1-200; }

          write_summary() { # write_summary <true|false> <reason>
            local n=${#files[@]} i
            {
              echo "### What changed"
              echo
              if [ "$1" = false ]; then
                echo "**Documentation only.** $skipped"
              elif [ -n "$first_code" ]; then
                echo "**Code changed.** \`$(safe "$first_code")\` is not documentation or metadata, so everything runs."
              else
                echo "**Treated as a code change.** Reason: $2."
              fi
              if [ "$n" -gt 0 ]; then
                echo
                echo "$n changed file$([ "$n" -eq 1 ] || echo s)."
              fi
              if [ "$EVENT_NAME" = pull_request ] && [ "$workflows" = 1 ]; then
                echo
                echo "**Workflow files are part of this change.** Approving the merge includes them: read them first."
              fi
              if [ "$n" -gt 0 ]; then
                echo
                echo "<details><summary>Changed files ($n)</summary>"
                echo
                for ((i = 0; i < n && i < 50; i++)); do
                  echo "- \`$(safe "${files[$i]}")\`"
                done
                if [ "$n" -gt 50 ]; then echo "- and $((n - 50)) more"; fi
                echo
                echo "</details>"
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          }

          decide() { # decide <true|false> <reason>
            echo "code=$1" >> "$GITHUB_OUTPUT"
            write_summary "$1" "$2"
            echo "code=$1 ($2)"
            exit 0
          }

          case "$EVENT_NAME" in
            pull_request)
              parents=$(git rev-list --parents -n 1 HEAD | wc -w)
              [ "$parents" -eq 3 ] || decide true "HEAD is not a merge commit; assuming code"
              base=HEAD^1
              ;;
            push | workflow_dispatch)
              [ "$EVENT_NAME" = push ] || [ -n "$BEFORE_SHA" ] || decide true "manual run without before: everything runs"
              base=""
              if [ -n "$BEFORE_SHA" ] && [ "${BEFORE_SHA//0/}" != "" ]; then
                git cat-file -e "${BEFORE_SHA}^{commit}" 2> /dev/null || git fetch --no-tags --depth=1 origin "$BEFORE_SHA" || true
                git cat-file -e "${BEFORE_SHA}^{commit}" 2> /dev/null && base="$BEFORE_SHA"
              fi
              if [ -z "$base" ] && [ "$EVENT_NAME" = workflow_dispatch ]; then
                decide true "the commit given as before is not available; assuming code"
              fi
              [ -n "$base" ] || { git rev-parse --verify --quiet HEAD^1 > /dev/null && base=HEAD^1; }
              [ -n "$base" ] || decide true "no earlier commit to compare with"
              ;;
            *)
              decide true "manual or scheduled run: everything runs"
              ;;
          esac

          while IFS= read -r -d '' file; do
            files+=("$file")
            case "$file" in .github/workflows/* | .github/actions/*) workflows=1 ;; esac
            if [ -z "$first_code" ] && ! is_docs "$file"; then
              first_code=$file
            fi
          done < <(git diff -z --name-only --no-renames "$base" HEAD)

          total=${#files[@]}
          [ "$total" -gt 0 ] || decide true "empty change"
          [ -z "$first_code" ] || decide true "first code file: $(safe "$first_code")"
          decide false "$total file(s) changed, all documentation or metadata"

  image:
    name: "Find or build image"
    needs: [changes]
    if: ${{ needs.changes.outputs.code == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write # pushes ghcr.io/<repo>:tree-<hash> when it has to build
    outputs:
      tree: ${{ steps.find.outputs.tree }}
      digest: ${{ steps.image.outputs.digest }}
      ref: ${{ steps.image.outputs.ref }}
      how: ${{ steps.image.outputs.how }} # reused | built
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Name the registry build cache
        id: cache
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}/buildcache" >> "$GITHUB_OUTPUT"

      - name: Find an image built from this tree
        id: find
        env:
          CAN_PUSH: true
        run: |
          set -euo pipefail
          # The image is named after the content it was built from: the git tree of the checked-out commit. A pull request's merge commit
          # and the squash commit that lands on main have the SAME tree when main did not move, so the image the pull request built is the
          # image that gets published; a different tree (main moved, a rebase with other changes) finds nothing and builds.
          tree=$(git rev-parse 'HEAD^{tree}')
          if ! [[ "$tree" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::unexpected tree id '$tree'"
            exit 1
          fi
          tag_ref="ghcr.io/${GITHUB_REPOSITORY,,}:tree-$tree"
          found=false
          digest=""
          note=""
          if [ "$CAN_PUSH" = true ]; then
            manifest="$RUNNER_TEMP/tree-manifest.json"
            err="$RUNNER_TEMP/tree-lookup.err"
            for attempt in 1 2 3; do
              if docker buildx imagetools inspect --raw "$tag_ref" > "$manifest" 2> "$err" && [ -s "$manifest" ]; then
                found=true
                digest="sha256:$(sha256sum "$manifest" | cut -d' ' -f1)"
                break
              fi
              if grep -qiE 'not found|manifest_unknown|name_unknown|404' "$err"; then
                note="no image for this tree yet"
                break
              fi
              # Not a clean "not found" (network, registry hiccup). Building is always safe: what is built is what gets scanned and shipped.
              note="the lookup failed ($(head -c 200 "$err" | tr '\n' ' ')), so the image is built"
              echo "::warning::looking up $tag_ref failed (attempt $attempt of 3): $(head -c 200 "$err" | tr '\n' ' ')"
              sleep $((attempt * 3))
            done
          else
            note="this run cannot push, so nothing can be reused"
          fi
          {
            echo "tree=$tree"
            echo "tag-ref=$tag_ref"
            echo "found=$found"
            echo "digest=$digest"
          } >> "$GITHUB_OUTPUT"
          if [ "$found" = true ]; then
            echo "tree $tree: image exists ($digest); no build"
          else
            echo "tree $tree: $note"
          fi

      - name: Build the image
        id: build
        if: steps.find.outputs.found != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          push: true
          tags: ${{ steps.find.outputs.tag-ref }}
          # where it was built (the signature of the published image names the commit that was shipped)
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha || github.sha }}
            io.platform-demo.tree=${{ steps.find.outputs.tree }}
            io.platform-demo.build-run=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          cache-from: type=registry,ref=${{ steps.cache.outputs.ref }}
          cache-to: type=registry,ref=${{ steps.cache.outputs.ref }},mode=max,image-manifest=true,oci-mediatypes=true

      - name: Record the image to scan
        id: image
        env:
          TREE: ${{ steps.find.outputs.tree }}
          FOUND: ${{ steps.find.outputs.found }}
          FOUND_DIGEST: ${{ steps.find.outputs.digest }}
          PUSH: true
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [ "$FOUND" = true ]; then
            how=reused
            digest=$FOUND_DIGEST
          elif [ "$PUSH" = true ]; then
            how=built
            digest=$BUILT_DIGEST
          else
            how=local
            digest=""
          fi
          if [ "$how" = local ]; then
            ref=service-ci-scan:local
          else
            if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::no valid image digest (got '$digest')"
              exit 1
            fi
            ref="ghcr.io/${GITHUB_REPOSITORY,,}@$digest"
          fi
          {
            echo "ref=$ref"
            echo "digest=$digest"
            echo "how=$how"
          } >> "$GITHUB_OUTPUT"

      - name: Write the image summary
        if: ${{ !cancelled() }}
        env:
          TREE: ${{ steps.find.outputs.tree }}
          HOW: ${{ steps.image.outputs.how }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          {
            echo "### Image"
            echo
            case "$HOW" in
              reused) echo "**Reused.** An image of this source tree already exists, so nothing was built." ;;
              built) echo "**Built** and pushed to the staging registry (ghcr.io)." ;;
              local) echo "**Built locally, not pushed.** This run cannot push (a fork or Dependabot pull request), so nothing is reused or published from it." ;;
              *) echo "**No image was produced.** See the failed step in the log." ;;
            esac
            echo
            echo "| | |"
            echo "|---|---|"
            if [ -n "$TREE" ] && { [ "$HOW" = reused ] || [ "$HOW" = built ]; }; then
              echo "| Tag | \`tree-$TREE\` |"
            fi
            [ -z "$DIGEST" ] || echo "| Digest | \`$DIGEST\` |"
            if [ -n "${SCAN:-}" ]; then
              case "$SCAN" in
                success) echo "| Trivy scan | passed: no HIGH or CRITICAL vulnerabilities |" ;;
                failure) echo "| Trivy scan | **failed**: HIGH or CRITICAL vulnerabilities, or the scan could not run. The table is in the log of the step \"Run Trivy vulnerability scanner\" |" ;;
                *) echo "| Trivy scan | not run |" ;;
              esac
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  scan:
    name: "Scan image"
    needs: [image]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.trivyignores != ''
        with:
          persist-credentials: false

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy vulnerability scanner
        id: trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # same version, threshold and ignore file as the image job of service-ci-<language>; new CVEs may have appeared since the pull request
          version: v0.76.1
          image-ref: ${{ needs.image.outputs.ref }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1
          trivyignores: ${{ inputs.trivyignores }}

      - name: Write the run summary
        if: ${{ !cancelled() }}
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
          SCAN: ${{ steps.trivy.outcome }}
        run: |
          set -euo pipefail
          {
            echo "### Image scan"
            echo
            case "$SCAN" in
              success) echo "Trivy found no HIGH or CRITICAL vulnerabilities in \`$DIGEST\`." ;;
              failure) echo "**Trivy failed** on \`$DIGEST\`: HIGH or CRITICAL vulnerabilities, or the scan could not run. The table is in the log of the step \"Run Trivy vulnerability scanner\". Nothing is published." ;;
              *) echo "Trivy did not run." ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: "Publish image"
    needs: [image, scan]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write # keyless cosign signing
      contents: read
      packages: read
    outputs:
      digest: ${{ steps.promote.outputs.digest }}
      tag: ${{ steps.promote.outputs.tag }}
      # no image reference here: it contains the Docker Hub account name, a secret, and GitHub drops outputs that contain secrets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Publishing is only allowed from commits on main
        run: |
          # Usual case (a push to main): the commit IS main's tip, one shallow fetch settles it. Otherwise (main moved on, a
          # manual run of an older commit) fetch main's history and ask git.
          git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
          if [ "$(git rev-parse refs/remotes/origin/main)" != "$GITHUB_SHA" ]; then
            if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
              git fetch --no-tags --unshallow origin main:refs/remotes/origin/main
            fi
            if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
              echo "::error::$GITHUB_SHA is not reachable from main; refusing to publish."
              exit 1
            fi
          fi

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Copy the scanned digest to Docker Hub (no rebuild)
        id: promote
        env:
          SOURCE: ${{ needs.image.outputs.ref }}
          SOURCE_DIGEST: ${{ needs.image.outputs.digest }}
          HUB_REPO: ${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.image-name || inputs.app }}
        run: |
          set -euo pipefail
          tag="sha-${GITHUB_SHA::7}"
          hub="$HUB_REPO:$tag"
          raw="$RUNNER_TEMP/hub-manifest.raw"

          if ! [[ "$SOURCE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::the scanned digest '$SOURCE_DIGEST' is not sha256:<64 hex>"
            exit 1
          fi

          # Prints the digest $1 points to. Returns 3 when the tag does not exist (or the repository does not exist yet), 1 when it could not
          # be read after 5 attempts.
          hub_digest() {
            local ref=$1 attempt
            for attempt in 1 2 3 4 5; do
              if docker buildx imagetools inspect --raw "$ref" > "$raw" 2> "$raw.err" && [ -s "$raw" ]; then
                echo "sha256:$(sha256sum "$raw" | cut -d' ' -f1)"
                return 0
              fi
              if grep -qiE 'not found|manifest_unknown|name_unknown|404|denied|does not exist' "$raw.err"; then
                return 3
              fi
              echo "::warning::reading $ref failed (attempt $attempt of 5); retrying" >&2
              sleep $((attempt * 5))
            done
            return 1
          }

          # A published tag is never moved: sha-<commit> names one digest for good (a re-run of this commit finds the same tree image).
          rc=0
          existing=$(hub_digest "$hub") || rc=$?
          if [ "$rc" = 0 ]; then
            if [ "$existing" != "$SOURCE_DIGEST" ]; then
              echo "::error::$tag already exists on Docker Hub with digest $existing; the image to publish is $SOURCE_DIGEST. A published tag is never moved."
              exit 1
            fi
            echo "$tag already points to $SOURCE_DIGEST (a re-run); copying again changes nothing"
          elif [ "$rc" = 1 ]; then
            echo "::warning::could not check whether $tag exists on Docker Hub; the read-back below still verifies the digest"
          fi

          docker buildx imagetools create --tag "$hub" "$SOURCE"

          # What is on Docker Hub must be the image Trivy scanned, byte for byte: anything else is a hard failure, nothing gets signed.
          rc=0
          digest=$(hub_digest "$hub") || rc=$?
          if [ "$rc" != 0 ]; then
            echo "::error::could not read $tag from Docker Hub after the copy"
            exit 1
          fi
          if [ "$digest" != "$SOURCE_DIGEST" ]; then
            echo "::error::Docker Hub has $digest for $tag but the scanned ghcr.io image is $SOURCE_DIGEST; refusing to sign an image that was not scanned"
            exit 1
          fi
          {
            echo "ref=${HUB_REPO}@${digest}"
            echo "digest=${digest}"
            echo "tag=${tag}"
          } >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Sign image
        env:
          REF: ${{ steps.promote.outputs.ref }}
        # Classic signature (a `sha256-<digest>.sig` tag). cosign 3's default bundle format is stored as an OCI referrer, which
        # Docker Hub does not serve, so the signature would be written but never found (and Kyverno/most verifiers expect the
        # classic layout today).
        run: cosign sign --yes --new-bundle-format=false --use-signing-config=false "$REF"

      - name: Verify the signature we just made
        env:
          REF: ${{ steps.promote.outputs.ref }}
          REPO: ${{ github.repository }}
        run: |
          # Docker Hub sometimes answers a fresh signature lookup with a transient error: retry before failing.
          for attempt in 1 2 3 4 5; do
            # Keyless identity is the workflow that ran the signing job.
            if cosign verify --new-bundle-format=false \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity-regexp "^https://github.com/((mladenovskistefan111|platform-boutique)/platform-demo-workflows|${REPO})/\.github/workflows/.+@" \
              "$REF" > /dev/null; then
              exit 0
            fi
            echo "::warning::signature lookup failed (attempt $attempt of 5)"
            sleep $((attempt * 10))
          done
          echo "::error::the signature could not be verified after 5 attempts"
          exit 1

      - name: Write the run summary
        env:
          TREE: ${{ needs.image.outputs.tree }}
          HOW: ${{ needs.image.outputs.how }}
          DIGEST: ${{ steps.promote.outputs.digest }}
          TAG: ${{ steps.promote.outputs.tag }}
          APP: ${{ inputs.app }}
          TARGET_ENV: ${{ inputs.env }}
          HELM_URL: https://github.com/platform-boutique/platform-demo-helm
        run: |
          set -euo pipefail
          short=${GITHUB_SHA:0:7}
          # The names come from the caller's file; they are only printed (and made into a link) when they are plain names.
          helm="the pull request in platform-demo-helm that moves the environment to this digest"
          if [[ "$APP" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] && [[ "$TARGET_ENV" =~ ^[a-z][a-z0-9-]*$ ]]; then
            helm="[the pull request in platform-demo-helm that moves \`$TARGET_ENV\` of \`$APP\` to this digest]($HELM_URL/pulls?q=is%3Apr+head%3Apromote%2F$APP%2F$TARGET_ENV), opened by the \`Open dev PR\` job (its summary links the exact one)"
          fi
          {
            echo "### Published \`$TAG\`"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | [\`$short\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA) |"
            echo "| Docker Hub tag | \`$TAG\` |"
            echo "| Digest | \`$DIGEST\` |"
            case "$HOW" in
              reused) echo "| Image | reused: built by the pull request from source tree \`$TREE\`, not built again |" ;;
              *) echo "| Image | built in this run from source tree \`$TREE\` (no image of this tree existed) |" ;;
            esac
            echo "| Signature | verified (keyless cosign; the certificate names this workflow and commit \`$short\`) |"
            echo "| Dev change | $helm |"
          } >> "$GITHUB_STEP_SUMMARY"

  sbom:
    name: "Create SBOM"
    needs: [publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write # keyless cosign attestation
      contents: read
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Name the published image
        id: published
        env:
          HUB_REPO: ${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.image-name || inputs.app }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          echo "ref=${HUB_REPO}@${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.published.outputs.ref }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Attach SBOM to image as a signed attestation
        env:
          REF: ${{ steps.published.outputs.ref }}
        run: cosign attest --yes --new-bundle-format=false --use-signing-config=false --type spdxjson --predicate sbom.spdx.json "$REF"

      - name: Verify the SBOM attestation we just made
        env:
          REF: ${{ steps.published.outputs.ref }}
          REPO: ${{ github.repository }}
        run: |
          for attempt in 1 2 3 4 5; do
            if cosign verify-attestation --new-bundle-format=false --type spdxjson \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity-regexp "^https://github.com/((mladenovskistefan111|platform-boutique)/platform-demo-workflows|${REPO})/\.github/workflows/.+@" \
              "$REF" > /dev/null; then
              exit 0
            fi
            echo "::warning::attestation lookup failed (attempt $attempt of 5)"
            sleep $((attempt * 10))
          done
          echo "::error::the SBOM attestation could not be verified after 5 attempts"
          exit 1

      - name: Write the run summary
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          {
            echo "### SBOM"
            echo
            echo "An SPDX SBOM is attached to \`$DIGEST\` as a signed attestation, and the attestation was verified."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: "Open dev PR"
    needs: [publish]
    # the one nested workflow: gitops-promote.yaml is shared with the helm repository and unchanged (works with the GitHub App token, not this one)
    permissions: {}
    uses: platform-boutique/platform-demo-workflows/.github/workflows/gitops-promote.yaml@341f641320553ad73969b637ff125466e6b2d99c # v3.1.0
    with:
      app: ${{ inputs.app }}
      env: ${{ inputs.env }}
      image-tag: ${{ needs.publish.outputs.tag }}
      image-digest: ${{ needs.publish.outputs.digest }}
      source-repository: ${{ github.repository }}
      source-sha: ${{ github.sha }}
      version: ${{ inputs.version }}
      auto-merge: ${{ inputs.auto-merge }}
    secrets:
      PROMOTE_APP_ID: ${{ secrets.PROMOTE_APP_ID }}
      PROMOTE_APP_PRIVATE_KEY: ${{ secrets.PROMOTE_APP_PRIVATE_KEY }}

  prune:
    name: "Clean up staging images"
    needs: [publish]
    if: ${{ inputs.prune }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write # deletes old versions of ghcr.io/<repo>; never the buildcache package
    env:
      GH_TOKEN: ${{ github.token }}
      OWNER: ${{ github.repository_owner }}
      PACKAGE: ${{ github.event.repository.name }}
      KEEP: ${{ inputs.prune-keep }}
      KEEP_TREE: ${{ inputs.prune-keep-tree }}
      UNTAGGED_DAYS: 7
      DRY_RUN: "false"
    steps:
      - name: Select and delete
        run: |
          python3 - <<'PY'
          import base64, json, os, re, subprocess, sys
          from datetime import datetime, timedelta, timezone

          owner, package = os.environ["OWNER"].lower(), os.environ["PACKAGE"]
          dry_run = os.environ["DRY_RUN"] == "true"
          MAX_DELETE = 100


          def die(msg):
              print(f"::error::{msg}")
              sys.exit(1)


          try:
              keep = int(float(os.environ["KEEP"]))
              keep_tree = int(float(os.environ["KEEP_TREE"]))
              untagged_days = int(float(os.environ["UNTAGGED_DAYS"]))
          except ValueError:
              die("keep, keep-tree and untagged-days must be numbers")
          if keep < 1 or keep_tree < 1 or untagged_days < 1:
              die("keep, keep-tree and untagged-days must be at least 1")
          # a plain package name only: "<package>/buildcache" (and anything else with a slash) can never be addressed
          if not re.fullmatch(r"[a-z0-9][a-z0-9._-]*", package):
              die(f"package '{package}' is not a plain container package name (lower case, no slash)")
          if not re.fullmatch(r"[a-z0-9][a-z0-9-]*", owner):
              die(f"unexpected owner '{owner}'")

          api = f"orgs/{owner}/packages/container/{package}/versions"


          def gh(*args, check=True):
              p = subprocess.run(["gh", *args], capture_output=True, text=True)
              if check and p.returncode != 0:
                  die(f"gh {' '.join(args[:2])} failed: {(p.stderr or p.stdout).strip()[:300]}")
              return p


          # ---- list (all pages) ------------------------------------------------------------------------------------------
          p = gh("api", "--paginate", f"{api}?state=active&per_page=100", check=False)
          if p.returncode != 0:
              if "404" in p.stderr + p.stdout:
                  print(f"::notice::package {owner}/{package} does not exist (yet); nothing to prune")
                  sys.exit(0)
              die(f"listing failed: {(p.stderr or p.stdout).strip()[:300]}")
          versions, dec, text, pos = [], json.JSONDecoder(), p.stdout.strip(), 0
          while pos < len(text):                      # --paginate prints one JSON array per page
              page, end = dec.raw_decode(text, pos)
              versions += page
              pos = end
              while pos < len(text) and text[pos].isspace():
                  pos += 1
          for v in versions:
              try:
                  assert isinstance(v["id"], int) and v["name"].startswith("sha256:")
                  v["_created"] = datetime.fromisoformat(v["created_at"].replace("Z", "+00:00"))
                  v["_tags"] = v["metadata"]["container"]["tags"]
                  assert isinstance(v["_tags"], list)
              except (KeyError, TypeError, AssertionError, ValueError):
                  die(f"the listing looks wrong (unexpected version object: {json.dumps({k: v[k] for k in ('id', 'name', 'created_at', 'metadata') if k in v}, default=str)[:200]}); nothing was deleted")
          if not versions:
              print(f"::notice::package {owner}/{package} has no versions; nothing to prune")
              sys.exit(0)
          versions.sort(key=lambda v: v["_created"], reverse=True)
          now = datetime.now(timezone.utc)
          cutoff = now - timedelta(days=untagged_days)


          # ---- classify ----------------------------------------------------------------------------------------------------
          FAMILIES = ("sha-", "tree-")                # the tags our images carry on ghcr.io: sha-<commit> (before v3.4) and tree-<hash>


          def protected(v):                           # a tag outside the families: latest, v1.2.3, ...
              return any(not t.startswith(FAMILIES) for t in v["_tags"])


          KEEP_OF = {"sha-": keep, "tree-": keep_tree}  # every pull-request push makes a tree- version, so that family keeps more
          kept, old_tagged = [], []                   # the newest N of EACH family stay; a version carrying both tags stays if either keeps it
          for prefix in FAMILIES:
              ranked = [v for v in versions if any(t.startswith(prefix) for t in v["_tags"])]
              kept += [v for v in ranked[:KEEP_OF[prefix]] if v not in kept]
              old_tagged += [v for v in ranked[KEEP_OF[prefix]:] if v not in old_tagged]
          old_tagged = [v for v in old_tagged if v not in kept]
          anchors = kept + [v for v in versions if protected(v) and v not in kept]   # their manifests must stay complete
          untagged = [v for v in versions if not v["_tags"]]


          # ---- children of the images we keep (index -> manifests) ------------------------------------------------------------
          b64 = base64.b64encode(os.environ["GH_TOKEN"].encode()).decode()
          print(f"::add-mask::{b64}")
          ACCEPT = ", ".join(["application/vnd.oci.image.index.v1+json", "application/vnd.docker.distribution.manifest.list.v2+json",
                              "application/vnd.oci.image.manifest.v1+json", "application/vnd.docker.distribution.manifest.v2+json"])
          by_digest = {v["name"] for v in versions}


          def manifest_children(digest):
              url = f"https://ghcr.io/v2/{owner}/{package}/manifests/{digest}"
              conf = f'header = "Authorization: Bearer {b64}"\nheader = "Accept: {ACCEPT}"\n'   # via stdin: not on the command line
              r = subprocess.run(["curl", "-fsS", "--retry", "3", "--retry-all-errors", "-K", "-", url],
                                 input=conf, capture_output=True, text=True)
              if r.returncode != 0:
                  die(f"could not read the manifest {digest} from ghcr.io ({r.stderr.strip()[:200]}); nothing was deleted")
              try:
                  doc = json.loads(r.stdout)
              except ValueError:
                  die(f"manifest {digest} is not JSON; nothing was deleted")
              return [(m["digest"], m.get("mediaType", "")) for m in doc.get("manifests", []) if isinstance(m, dict) and "digest" in m]


          referenced, queue, seen = set(), [v["name"] for v in anchors], set()
          depth = 0
          while queue and depth < 3:
              nxt = []
              for d in queue:
                  if d in seen:
                      continue
                  seen.add(d)
                  for child, media in manifest_children(d):
                      referenced.add(child)
                      if "index" in media or "manifest.list" in media:   # a nested index: look inside; a plain manifest has no children
                          nxt.append(child)
              queue, depth = nxt, depth + 1

          # ---- plan --------------------------------------------------------------------------------------------------------
          plan = []                                    # (version, reason)
          for v in old_tagged:
              if protected(v):
                  continue
              if v["name"] in referenced:
                  continue
              plan.append((v, f"older than the newest of its tag family (keeping {keep} sha-*, {keep_tree} tree-*)"))
          for v in untagged:
              if v["_created"] < cutoff and v["name"] not in referenced:
                  plan.append((v, f"untagged for more than {untagged_days} days and not referenced by a kept image"))

          def show(v):
              return f"id={v['id']} {v['name'][:19]} created={v['_created']:%Y-%m-%d %H:%M} tags={','.join(v['_tags']) or '-'}"

          print(f"{owner}/{package}: {len(versions)} version(s): {len(kept)} kept (newest {keep} sha-*, newest {keep_tree} tree-*), "
                f"{len([v for v in anchors if v not in kept])} with other tags (never deleted), {len(untagged)} untagged, "
                f"{len(referenced & by_digest)} referenced by kept images")
          for v in kept:
              print(f"  KEEP    {show(v)}")

          # ---- sanity: refuse rather than guess ------------------------------------------------------------------------------
          if plan:
              ids = {v["id"] for v, _ in plan}
              if not kept:
                  die("no sha-* or tree-* tagged version to keep; refusing to delete anything (did the tag format change?)")
              if len(plan) >= len(versions):
                  die("the plan would remove every version; refusing")
              if versions[0]["id"] in ids:
                  die("the newest version is in the delete list; refusing")
              if any(v["id"] in ids for v in kept):
                  die("a kept version is in the delete list; refusing")

          plan.sort(key=lambda t: t[0]["_created"])    # oldest first
          truncated = len(plan) > MAX_DELETE
          todo = plan[:MAX_DELETE]
          failures = 0
          deleted = 0
          for v, reason in todo:
              label = "WOULD DELETE" if dry_run else "DELETE"
              print(f"  {label} {show(v)}  ({reason})")
              if dry_run:
                  continue
              r = gh("api", "-X", "DELETE", f"{api}/{v['id']}", check=False)
              if r.returncode == 0:
                  deleted += 1
              if r.returncode != 0:
                  err = (r.stderr + r.stdout)
                  if "404" in err:
                      continue                           # already gone
                  failures += 1
                  print(f"::error::delete of {v['id']} failed: {err.strip()[:300]}")
                  if "403" in err:
                      print("::error::403: the token needs the admin role on this package (Package settings > Manage Actions access)")
                      break
          if truncated:
              print(f"::notice::{len(plan)} versions qualify; only the oldest {MAX_DELETE} are handled per run, the next run continues")
          if not plan:
              print("nothing to delete")

          def plain(text):                             # tags come from the registry: plain characters only inside the table
              return re.sub(r"[^A-Za-z0-9._,:@/ +-]", "?", str(text))


          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as s:
              s.write(f"### Clean up staging images{' (dry run)' if dry_run else ''}\n\n")
              handled = len(todo) if dry_run else deleted
              s.write(f"`ghcr.io/{owner}/{package}` had {len(versions)} versions; {'would delete' if dry_run else 'deleted'} {handled}, "
                      f"{len(versions) - handled} {'would remain' if dry_run else 'remain'}"
                      f"{'; ' + str(failures) + ' deletion(s) failed, see the log' if failures else ''}"
                      f"{'; more qualify, the next run continues' if truncated else ''}.\n")
              if todo:
                  s.write(f"\n<details><summary>{'Versions that would be deleted' if dry_run else 'Versions selected for deletion'} ({len(todo)})</summary>\n\n")
                  s.write("| Version | Digest | Created | Tags | Reason |\n|---|---|---|---|---|\n")
                  for v, reason in todo:
                      s.write(f"| {v['id']} | `{plain(v['name'][:19])}` | {v['_created']:%Y-%m-%d} | {plain(','.join(v['_tags']) or '-')} | {reason} |\n")
                  s.write("\n</details>\n")
          sys.exit(1 if failures else 0)
          PY
