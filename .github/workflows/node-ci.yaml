name: Node CI

# Reusable pipeline for the Node/TypeScript services (currency, payment): format/typecheck/lint, secret scan, build, tests, SCA (npm audit), SAST (Semgrep), optional gRPC smoke test.
# Call it with:  uses: platform-boutique/platform-demo-workflows/.github/workflows/node-ci.yaml@<sha> # <tag>

on:
  workflow_call:
    inputs:
      node-version-file:
        type: string
        default: .nvmrc
      semgrep-config:
        type: string
        default: p/typescript p/nodejs p/secrets
      semgrep-version:
        type: string
        default: 1.180.0
      smoke-port:
        description: gRPC port for a start-the-server health smoke test; empty skips the job
        type: string
        default: ""
      smoke-command:
        description: Command that starts the built server (run after the build)
        type: string
        default: node dist/server.js
      smoke-health-args:
        description: Extra grpcurl arguments for the health check (no reflection, so point at the proto)
        type: string
        default: -import-path ./proto -proto health.proto
      smoke-script:
        description: Optional script in the caller repo for service-specific checks (gets GRPCURL and SMOKE_PORT)
        type: string
        default: ""
      secret-scan:
        description: Run the Secret Scan job in this workflow. service-ci sets it to false because it runs one scan for every language itself.
        type: boolean
        default: true

# Least privilege by default; every job below declares what it needs.
permissions: {}

jobs:
  lint-format:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ inputs.node-version-file }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

  secret-scan:
    name: Secret Scan
    if: inputs.secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # pull request: depth 2 is enough to reach both parents of the merge commit; anything else (manual run): full history
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}
          persist-credentials: false

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSL --retry 3 --retry-all-errors -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Run gitleaks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # the open-source CLI, not gitleaks-action: the Action needs a paid license in organisation-owned repositories
          if [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ]; then
            # Pull request: scan only its commits (BASE..HEAD) without cloning the whole history. Make sure both ends exist, then
            # deepen until they share an ancestor (the range is then complete); give up and fetch everything after 10 rounds.
            for sha in "$BASE_SHA" "$HEAD_SHA"; do
              git cat-file -e "${sha}^{commit}" 2>/dev/null || git fetch --no-tags --depth=2 origin "$sha"
            done
            rounds=0
            until git merge-base "$BASE_SHA" "$HEAD_SHA" > /dev/null 2>&1; do
              rounds=$((rounds + 1))
              if [ "$rounds" -gt 10 ]; then
                git fetch --no-tags --unshallow origin || true
                break
              fi
              git fetch --no-tags --deepen=50 origin "$BASE_SHA" "$HEAD_SHA"
            done
            gitleaks git --redact --verbose --log-opts="${BASE_SHA}..${HEAD_SHA}"   # the pull request's commits
          else
            gitleaks git --redact --verbose                                           # manual run: the whole history
          fi

  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ inputs.node-version-file }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ inputs.node-version-file }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:ci

  # ─── security scans (all jobs run in parallel) ────────────────────────────

  sca:
    name: SCA - Dependency Vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ inputs.node-version-file }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        # audit-level=high: fail only on high/critical findings
        run: npm audit --audit-level=high --omit=dev

  sast:
    name: SAST - Static Security Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install Semgrep
        env:
          VERSION: ${{ inputs.semgrep-version }}
        run: pip install "semgrep==${VERSION}"

      - name: Run Semgrep
        env:
          SEMGREP_CONFIG: ${{ inputs.semgrep-config }}
        run: |
          read -ra rules <<< "$SEMGREP_CONFIG"
          args=()
          for rule in "${rules[@]}"; do
            args+=(--config "$rule")
          done
          semgrep scan "${args[@]}" --error --metrics=off

  smoke-test:
    name: Smoke Test (gRPC health)
    if: inputs.smoke-port != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ inputs.node-version-file }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build server
        run: npm run build

      - name: Install grpcurl
        env:
          VERSION: 1.9.4
          SHA256: 97e13d58d2733a0e62cd2571d1d5f0c02823f0d25282f08bddedf1ad9c5d1736
        run: |
          curl -fsSL -o grpcurl.tgz "https://github.com/fullstorydev/grpcurl/releases/download/v${VERSION}/grpcurl_${VERSION}_linux_x86_64.tar.gz"
          echo "${SHA256}  grpcurl.tgz" | sha256sum -c -
          tar -xzf grpcurl.tgz -C "$RUNNER_TEMP" grpcurl

      - name: Start server and check gRPC health
        env:
          SMOKE_PORT: ${{ inputs.smoke-port }}
          SMOKE_COMMAND: ${{ inputs.smoke-command }}
          HEALTH_ARGS: ${{ inputs.smoke-health-args }}
          SMOKE_SCRIPT: ${{ inputs.smoke-script }}
        run: |
          export GRPCURL="$RUNNER_TEMP/grpcurl"
          read -ra server_cmd <<< "$SMOKE_COMMAND"
          read -ra health_args <<< "$HEALTH_ARGS"
          PORT="$SMOKE_PORT" "${server_cmd[@]}" &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          sleep 2
          response=$("$GRPCURL" -plaintext "${health_args[@]}" "localhost:${SMOKE_PORT}" grpc.health.v1.Health/Check)
          status=$(echo "$response" | grep -o '"status": "[^"]*"' | cut -d'"' -f4)
          if [ "$status" != "SERVING" ]; then
            echo "FAIL: expected SERVING, got '$status'"
            exit 1
          fi
          echo "PASS: service is SERVING"
          if [ -n "$SMOKE_SCRIPT" ]; then
            bash "$SMOKE_SCRIPT"
          fi
