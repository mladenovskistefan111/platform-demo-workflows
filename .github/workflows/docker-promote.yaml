name: Docker promote, sign and SBOM

# Promotes an image that docker-build.yaml already scanned: the *same digest* is copied from
# ghcr.io to Docker Hub (no rebuild), tagged, signed with cosign (keyless) and given an SBOM.
# Refuses to run unless the commit is reachable from `main`.
# Call it with:  uses: mladenovskistefan111/platform-demo-workflows/.github/workflows/docker-promote.yaml@<tag or sha>

on:
  workflow_call:
    inputs:
      image-name:
        description: Docker Hub repository name under the account, e.g. checkout-service
        type: string
        required: true
      staged-image:
        description: ghcr.io reference by digest, from docker-build.yaml
        type: string
        required: true
      digest:
        description: Digest from docker-build.yaml (used to detect a digest change during promotion)
        type: string
        required: true
      tag-latest:
        description: Also move the `latest` tag (always done for v* tag releases)
        type: boolean
        default: false
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true
    outputs:
      image:
        description: Docker Hub reference by digest
        value: ${{ jobs.promote.outputs.image }}

# Least privilege by default; the job below declares what it needs.
permissions: {}

jobs:
  promote:
    name: Promote, Sign & SBOM (Docker Hub)
    runs-on: ubuntu-latest
    permissions:
      id-token: write # keyless cosign signing
      contents: read
      packages: read
    outputs:
      image: ${{ steps.promote.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Publishing is only allowed from commits on main
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not reachable from main; refusing to publish."
            exit 1
          fi

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker Hub metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.image-name }}
          tags: |
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ inputs.tag-latest || startsWith(github.ref, 'refs/tags/v') }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Promote the scanned digest to Docker Hub (no rebuild)
        id: promote
        env:
          SOURCE: ${{ inputs.staged-image }}
          SOURCE_DIGEST: ${{ inputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
          HUB_REPO: ${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.image-name }}
        run: |
          args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && args+=(--tag "$tag")
          done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" "$SOURCE"

          first_tag=$(head -n1 <<< "$TAGS")
          digest="sha256:$(docker buildx imagetools inspect --raw "$first_tag" | sha256sum | cut -d' ' -f1)"
          if [ "$digest" != "$SOURCE_DIGEST" ]; then
            echo "::warning::Docker Hub digest ($digest) differs from the scanned ghcr.io digest ($SOURCE_DIGEST)"
          fi
          echo "ref=${HUB_REPO}@${digest}" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.5.2

      - name: Sign image
        env:
          REF: ${{ steps.promote.outputs.ref }}
        run: cosign sign --yes "$REF"

      - name: Verify the signature we just made
        env:
          REF: ${{ steps.promote.outputs.ref }}
          REPO: ${{ github.repository }}
        run: |
          # Keyless identity is the workflow that ran the signing job.
          cosign verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "^https://github.com/(mladenovskistefan111/platform-demo-workflows|${REPO})/\.github/workflows/.+@" \
            "$REF" > /dev/null

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.promote.outputs.ref }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Attach SBOM to image
        env:
          REF: ${{ steps.promote.outputs.ref }}
        run: cosign attach sbom --sbom sbom.spdx.json "$REF"
