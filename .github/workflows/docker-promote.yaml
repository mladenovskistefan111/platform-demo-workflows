name: Docker promote, sign and SBOM

# Promotes an image that docker-build.yaml already scanned: the *same digest* is copied from
# ghcr.io to Docker Hub (no rebuild), tagged, signed with cosign (keyless) and given an SBOM.
# Refuses to run unless the commit is reachable from `main`.
# Tags: `sha-<7 chars>` always; with `sha-only: true` nothing else (service-publish: no `latest`, no semver - releases are digests
# promoted through the helm repository). Without it, semver tags and `latest` are added for v* tag releases, as in v2/v3.0.
# The cosign self-verification is retried: Docker Hub answers a fresh signature lookup with a transient error now and then.
# Call it with:  uses: platform-boutique/platform-demo-workflows/.github/workflows/docker-promote.yaml@<tag or sha>

on:
  workflow_call:
    inputs:
      image-name:
        description: Docker Hub repository name under the account, e.g. checkout-service
        type: string
        required: true
      staged-image:
        description: ghcr.io reference by digest, from docker-build.yaml
        type: string
        required: true
      digest:
        description: Digest from docker-build.yaml (used to detect a digest change during promotion)
        type: string
        required: true
      tag-latest:
        description: Also move the `latest` tag (always done for v* tag releases)
        type: boolean
        default: false
      sha-only:
        description: Publish only the `sha-<7 chars>` tag (no semver tag, no `latest`), whatever ref ran this
        type: boolean
        default: false
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true
    outputs:
      image:
        description: Docker Hub reference by digest
        value: ${{ jobs.promote.outputs.image }}
      digest:
        description: Digest of the image on Docker Hub (sha256:...)
        value: ${{ jobs.promote.outputs.digest }}
      tag:
        description: The `sha-<7 chars>` tag
        value: ${{ jobs.promote.outputs.tag }}

# Least privilege by default; the job below declares what it needs.
permissions: {}

jobs:
  promote:
    name: Promote, Sign & SBOM (Docker Hub)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write # keyless cosign signing
      contents: read
      packages: read
    outputs:
      image: ${{ steps.promote.outputs.ref }}
      digest: ${{ steps.promote.outputs.digest }}
      tag: ${{ steps.promote.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Publishing is only allowed from commits on main
        run: |
          # Usual case (a push to main): the commit IS main's tip, one shallow fetch settles it. Otherwise (main moved on, a
          # manual run of an older commit) fetch main's history and ask git.
          git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
          if [ "$(git rev-parse refs/remotes/origin/main)" != "$GITHUB_SHA" ]; then
            if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
              git fetch --no-tags --unshallow origin main:refs/remotes/origin/main
            fi
            if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
              echo "::error::$GITHUB_SHA is not reachable from main; refusing to publish."
              exit 1
            fi
          fi

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker Hub metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.image-name }}
          tags: |
            type=sha,prefix=sha-
            type=semver,pattern={{version}},enable=${{ !inputs.sha-only }}
            type=raw,value=latest,enable=${{ !inputs.sha-only && (inputs.tag-latest || startsWith(github.ref, 'refs/tags/v')) }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Promote the scanned digest to Docker Hub (no rebuild)
        id: promote
        env:
          SOURCE: ${{ inputs.staged-image }}
          SOURCE_DIGEST: ${{ inputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
          HUB_REPO: ${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.image-name }}
        run: |
          args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && args+=(--tag "$tag")
          done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" "$SOURCE"

          first_tag=$(head -n1 <<< "$TAGS")
          read_ok=""
          for attempt in 1 2 3 4 5; do
            if docker buildx imagetools inspect --raw "$first_tag" > "$RUNNER_TEMP/manifest.raw"; then read_ok=1; break; fi
            echo "::warning::reading $first_tag failed (attempt $attempt); retrying"
            sleep $((attempt * 5))
          done
          [ -n "$read_ok" ] || { echo "::error::could not read $first_tag after the copy"; exit 1; }
          digest="sha256:$(sha256sum "$RUNNER_TEMP/manifest.raw" | cut -d' ' -f1)"
          if [ "$digest" != "$SOURCE_DIGEST" ]; then
            echo "::warning::Docker Hub digest ($digest) differs from the scanned ghcr.io digest ($SOURCE_DIGEST)"
          fi
          {
            echo "ref=${HUB_REPO}@${digest}"
            echo "digest=${digest}"
            echo "tag=${first_tag##*:}"
          } >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Sign image
        env:
          REF: ${{ steps.promote.outputs.ref }}
        # Classic signature (a `sha256-<digest>.sig` tag). cosign 3's default bundle format is stored as an OCI referrer, which
        # Docker Hub does not serve, so the signature would be written but never found (and Kyverno/most verifiers expect the
        # classic layout today).
        run: cosign sign --yes --new-bundle-format=false --use-signing-config=false "$REF"

      - name: Verify the signature we just made
        env:
          REF: ${{ steps.promote.outputs.ref }}
          REPO: ${{ github.repository }}
        run: |
          # Docker Hub sometimes answers a fresh signature lookup with a transient error: retry before failing.
          for attempt in 1 2 3 4 5; do
            # Keyless identity is the workflow that ran the signing job.
            if cosign verify --new-bundle-format=false \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity-regexp "^https://github.com/((mladenovskistefan111|platform-boutique)/platform-demo-workflows|${REPO})/\.github/workflows/.+@" \
              "$REF" > /dev/null; then
              exit 0
            fi
            echo "::warning::signature lookup failed (attempt $attempt of 5)"
            sleep $((attempt * 10))
          done
          echo "::error::the signature could not be verified after 5 attempts"
          exit 1

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.promote.outputs.ref }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Attach SBOM to image as a signed attestation
        env:
          REF: ${{ steps.promote.outputs.ref }}
        run: cosign attest --yes --new-bundle-format=false --use-signing-config=false --type spdxjson --predicate sbom.spdx.json "$REF"

      - name: Verify the SBOM attestation we just made
        env:
          REF: ${{ steps.promote.outputs.ref }}
          REPO: ${{ github.repository }}
        run: |
          for attempt in 1 2 3 4 5; do
            if cosign verify-attestation --new-bundle-format=false --type spdxjson \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity-regexp "^https://github.com/((mladenovskistefan111|platform-boutique)/platform-demo-workflows|${REPO})/\.github/workflows/.+@" \
              "$REF" > /dev/null; then
              exit 0
            fi
            echo "::warning::attestation lookup failed (attempt $attempt of 5)"
            sleep $((attempt * 10))
          done
          echo "::error::the SBOM attestation could not be verified after 5 attempts"
          exit 1
