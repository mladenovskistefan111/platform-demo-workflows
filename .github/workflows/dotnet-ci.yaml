name: .NET CI

# Reusable pipeline for .NET services (cart-service): format + analyzers, secret scan, build, tests, SCA (dotnet list --vulnerable), SAST (Semgrep).
# Call it with:  uses: platform-boutique/platform-demo-workflows/.github/workflows/dotnet-ci.yaml@<sha> # <tag>

on:
  workflow_call:
    inputs:
      dotnet-version-file:
        type: string
        default: global.json
      solution:
        type: string
        required: true
      project:
        description: Main project (build + vulnerability audit)
        type: string
        required: true
      test-project:
        type: string
        required: true
      test-filter:
        type: string
        default: FullyQualifiedName!~Integration&FullyQualifiedName!~E2E
      semgrep-config:
        type: string
        default: p/csharp p/owasp-top-ten
      semgrep-version:
        type: string
        default: 1.180.0

# Least privilege by default; every job below declares what it needs.
permissions: {}

jobs:
  lint-format:
    name: Lint & Format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version-file: ${{ inputs.dotnet-version-file }}

      - name: Restore tools
        run: dotnet tool restore

      - name: Check formatting
        run: dotnet format --verify-no-changes --verbosity diagnostic

      - name: Lint (Roslyn Analyzers)
        env:
          SOLUTION: ${{ inputs.solution }}
        run: dotnet build "$SOLUTION" --configuration Release /warnaserror

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so gitleaks scans every commit
          persist-credentials: false

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Run gitleaks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # the open-source CLI, not gitleaks-action: the Action needs a paid license in organisation-owned repositories
          if [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ]; then
            gitleaks git --redact --verbose --log-opts="${BASE_SHA}..${HEAD_SHA}"   # the pull request's commits
          else
            gitleaks git --redact --verbose                                           # manual run: the whole history
          fi

  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version-file: ${{ inputs.dotnet-version-file }}

      - name: Build
        env:
          PROJECT: ${{ inputs.project }}
        run: dotnet build "$PROJECT" --configuration Release

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write # test-reporter publishes a check run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version-file: ${{ inputs.dotnet-version-file }}

      - name: Restore dependencies
        env:
          TEST_PROJECT: ${{ inputs.test-project }}
        run: dotnet restore "$TEST_PROJECT"

      - name: Run unit tests
        env:
          TEST_PROJECT: ${{ inputs.test-project }}
          TEST_FILTER: ${{ inputs.test-filter }}
        run: |
          dotnet test "$TEST_PROJECT" \
            --configuration Release \
            --no-restore \
            --filter "$TEST_FILTER" \
            --logger "trx;LogFileName=unit-test-results.trx" \
            --results-directory ./test-results

      - name: Publish test results
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: always()
        with:
          name: Unit Test Results
          path: test-results/unit-test-results.trx
          reporter: dotnet-trx

  # ─── STAGE 2 (parallel) ───────────────────────────────────────────────────

  sca:
    name: SCA - Dependency Vulnerabilities
    runs-on: ubuntu-latest
    needs: [lint-format, secret-scan, build-check, unit-tests]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version-file: ${{ inputs.dotnet-version-file }}

      - name: Restore dependencies
        env:
          PROJECT: ${{ inputs.project }}
        run: dotnet restore "$PROJECT"

      - name: Check for vulnerable packages
        env:
          PROJECT: ${{ inputs.project }}
        run: |
          dotnet list "$PROJECT" package --vulnerable --include-transitive 2>&1 | tee vuln-report.txt
          if grep -q "has the following vulnerable packages" vuln-report.txt; then
            echo "FAIL: vulnerable packages found"
            cat vuln-report.txt
            exit 1
          fi
          echo "PASS: no vulnerable packages found"

  sast:
    name: SAST - Static Security Analysis
    runs-on: ubuntu-latest
    needs: [lint-format, secret-scan, build-check, unit-tests]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install Semgrep
        env:
          VERSION: ${{ inputs.semgrep-version }}
        run: pip install "semgrep==${VERSION}"

      - name: Run Semgrep
        env:
          SEMGREP_CONFIG: ${{ inputs.semgrep-config }}
        run: |
          read -ra rules <<< "$SEMGREP_CONFIG"
          args=()
          for rule in "${rules[@]}"; do
            args+=(--config "$rule")
          done
          semgrep scan "${args[@]}" --error --metrics=off
