version: 2
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: monthly
updates:
  - package-ecosystem: github-actions
    directory: /
    multi-ecosystem-group: dependencies
    patterns: ["*"]
    cooldown:
      default-days: 7 # let a new release settle before it is proposed
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
